name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Fail the build if a key-shaped string was committed.
      - name: Secret scan
        run: npm run check:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Consent / gating tests
        run: |
          npm run test:consent
          npm run test:gating
          npm run test:intention
          npm run test:email
  benefits-lab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: benny_lab
          POSTGRES_DB: benny_benefits_lab
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U benny_lab -d benny_benefits_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Native document readers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng util-linux
      - name: Shared personal context, durable runtime and document checks
        env:
          DOTENV_CONFIG_PATH: /dev/null
        run: |
          npm run test:personal
          npm run test:documents
          npm run test:benny
          npm run test:portals
          npm run test:readiness
      - run: npm run test:benefits
      - run: node --check public/benefits-lab/lab.js
