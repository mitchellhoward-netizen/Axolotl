name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Fail the build if a key-shaped string was committed.
      - name: Secret scan
        run: npm run check:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Consent / gating tests
        run: |
          npm run test:consent
          npm run test:gating
          npm run test:intention
