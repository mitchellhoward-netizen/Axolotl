- case: MCD-X-01
  state: ny
  title: "Cross-playbook (MSP): 70-year-old, Social Security $1,800 \u2014 SSI-related Medicaid and QMB together"
  ours:
    status: eligible
    tier: ssi_related
  policyengine:
    status: ineligible
    tier: null
  agree: false
  explanation: New York's SSI-related income level. PolicyEngine's New York senior_or_disabled income limit parameter is 82% FPL (and its asset
    limit $31,175 / $42,312 from 2024), the pre-2023 level. New York's 2026 chart (GIS 26 MA/05 attachment) sets the SSI-related Medicaid income
    level at 138% FPL ($1,836 / $2,489) and resources $33,038 / $44,796 (MCD-NY-SSI-RELATED-INCOME, MCD-NY-RESOURCE-LEVEL). These people are eligible
    without spenddown under New York's current levels.
  ours_federal_minimum:
    status: ineligible
    tier: null
  federal_minimum_agrees: true
