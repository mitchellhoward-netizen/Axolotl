- case: MCD-X-00
  state: il
  title: 'Cross-state: 70-year-old with Medicare, Social Security $1,200, $60,000 savings'
  ours:
    status: eligible
    tier: aabd_spenddown
  policyengine:
    status: ineligible
    tier: null
  agree: false
  explanation: Illinois spenddown not modelled. Over the AABD income standard ($1,330) or the $17,500 asset limit, an Illinois community case
    is enrolled in spenddown rather than denied (PM 15-02-02, PM 15-04-01; MCD-IL-SPENDDOWN); the archive reports eligible with the spenddown
