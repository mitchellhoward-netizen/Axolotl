- case: LTC-IL-T08
  state: il
  title: 'Single, home equity $760,000, nobody at home: over Illinois''s $752,000 limit'
  ours:
    status: ineligible
    tier: home_equity_test
  policyengine:
    status: eligible
    tier: home_equity_test
  agree: false
  explanation: 'State policy choice, not a logic difference. PolicyEngine uses one national home equity limit, the federal maximum ($1,130,000
    in 2026, parameter gov.hhs.medicaid.eligibility.long_term_care.home_equity.limit), for every state. Illinois elected the federal minimum:
    $752,000 for 2026 (IDHS WAG 25-03-02 (2), PM 07-02-04-a). The household''s $760,000 equity is between the two, so Illinois denies long-term
    care and PolicyEngine does not. Our federal-minimum column (federal maximum limit) matches PolicyEngine.'
  ours_federal_minimum:
    status: eligible
    tier: home_equity_test
  federal_minimum_agrees: true
