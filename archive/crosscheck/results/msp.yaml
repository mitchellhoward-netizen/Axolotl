- case: MSP-NY-T13
  state: ca
  title: "Working 67-year-old: SS $900 + wages $1,500 \u2014 gross $2,400 but QMB after earned income disregards"
  ours:
    status: eligible
    tier: QI
  policyengine:
    status: ineligible
    tier: null
    countable_income: 1597.5
  agree: false
  explanation: PolicyEngine excludes QI for anyone it computes as Medicaid-eligible (is_qi_eligible uses is_medicaid_eligible), and it computes
    these aged Californians (countable $1,795 / $1,597.50) as eligible for Medi-Cal's Aged & Disabled FPL program. The archive bars QI only for
    a person who has Medi-Cal (MSP-CA-QI-NOT-MEDI-CAL; DHCS page "cannot also receive Medi-Cal"). Whether being merely eligible for ABD FPL Medi-Cal
    bars QI in California is an open policy point (MSP-CA-OQ-01; 42 U.S.C. 1396a(a)(10)(E)(iv) says "not otherwise eligible").
  ours_federal_minimum:
    status: eligible
    tier: QI
  federal_minimum_agrees: false
- case: MSP-NY-T13
  state: il
  title: "Working 67-year-old: SS $900 + wages $1,500 \u2014 gross $2,400 but QMB after earned income disregards"
  ours:
    status: undetermined
    tier: null
  policyengine:
    status: eligible
    tier: QI
    countable_income: 1597.5
  agree: false
  explanation: Earned income. Illinois counts MSP income with AABD rules ($25 exemption, then $20 plus one-half of the next $60 of earnings, PM
    08-02-03-a), which here leaves the person over the QI-1 band; SSI methodology ($65 plus one-half, what PolicyEngine and federal law use) gives
    a qualifying tier. The archive returns undetermined (MSP-IL-OQ-02, conflict MSP-IL-CONFLICT-04) instead of picking one.
  ours_federal_minimum:
    status: eligible
    tier: QI
  federal_minimum_agrees: true
