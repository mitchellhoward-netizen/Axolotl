# Why archive results differ from PolicyEngine US for the school meals playbook.
# Each entry names the cases it covers. crosscheck/run.py fails on any difference not listed.
# "free_universal" in the archive is compared as "free" (PolicyEngine's FREE tier includes
# its state universal-meal flag).
explanations:
  - cases: [SCH-CA-T05, SCH-CA-T06, SCH-CA-T08, SCH-CA-T10]
    match: {state: ca}
    reason: >-
      Policy-coverage difference. These students attend a private school in the
      NSLP. PolicyEngine's state_universal_free_meals flag gives every California
      household the FREE tier from 2022-07-01, whatever the school. The archive
      follows Education Code 49501.5 and CDE's Universal Meals guidelines (section
      IV, "Private/nonpublic schools are generally not required to comply"), so a
      private-school student gets only the federal category (reduced or paid here).
      Our federal category matches PolicyEngine's own federal tier for all four.
      For SCH-CA-T10 the archive also withholds Medi-Cal direct certification,
      which runs only through CALPADS (not modelled in PolicyEngine).
  - cases: [SCH-IL-T12]
    match: {state: il}
    reason: >-
      Unit-of-eligibility difference. The student is the foster child's
      non-foster sibling. PolicyEngine computes categorical eligibility for the
      whole SPM unit, so one member with was_in_foster_care makes every child FREE.
      Under 7 CFR 245.2 and the FNS Eligibility Manual (Other Source Categorically
      Eligible), foster, homeless, migrant, runaway and Head Start eligibility
      covers only that child; the sibling is judged on household income ($70,000
      for 4 = paid). Rule SCH-FED-CATEGORICAL-INDIVIDUAL.
  - cases: [SCH-IL-T13]
    match: {state: il}
    reason: >-
      PolicyEngine does not model the Community Eligibility Provision. The school
      is a CEP school (7 CFR 245.9(f)), which serves breakfast and lunch free to
      all enrolled students; PolicyEngine sees only the $90,000 income (paid).
  - cases: [SCH-IL-T17]
    match: {state: il}
    reason: >-
      School-year vs calendar-year guidelines. On 2026-03-02 the 2025-26 income
      eligibility guidelines apply (July 1, 2025 - June 30, 2026, built on the 2025
      poverty guidelines; free limit $41,795 for 4, FR Doc. 2025-03821).
      PolicyEngine divides by the 2026 poverty guideline for the 2026 period
      ($33,000), so $41,796 is 126.7% FPL and FREE. Under the guidelines in force
      it is $1 over the free limit: reduced price (SCH-FED-SCHOOL-YEAR-IEGS).
  - cases: [SCH-NY-T11]
    match: {state: ny}
    reason: >-
      Coverage difference. The school does not run the NSLP/SBP. New York's
      universal free meals (Education Law 915-a; NYSED memo of May 13, 2025) cover
      only schools that participate in the federal programs, and without the NSLP
      there are no federal free or reduced-price meals. PolicyEngine has no school
      participation input and gives every New York household FREE from 2025-07-01.
  - cases: [SCH-NY-T12]
    match: {state: ny}
    reason: >-
      PolicyEngine timing choice. The date is 2025-09-15, in the first school year
      of New York's universal free meals (from July 1, 2025). PolicyEngine's school
      meal variables are yearly and read the state universal-meal parameter at the
      start of the period (January 1, 2025, when it was still false), so it
      returns PAID for calendar 2025. The archive applies Education Law 915-a from
      SY 2025-26 (ny.nysed.universal_meals_start).
