# Why archive results differ from PolicyEngine US for the Medicaid playbook.
# Each entry names the cases it covers. crosscheck/run.py fails on any difference not listed.
explanations:
  - cases: [MCD-IL-T02, MCD-IL-T04]
    match: {state: il}
    reason: >-
      Rounding of the 138% FPL monthly limit. PolicyEngine computes the monthly
      limit as 138% x the annual guideline / 12 and rounds it UP to the next
      dollar (its medicaid_income_level helper: $1,835.40 -> $1,836 for one,
      $3,141.84 -> $3,142 for three). Illinois publishes $1,835 and $3,141
      (WAG 25-03-02 (2), rounded down), so a household $1 over the Illinois
      figure is still within PolicyEngine's. The archive follows the IDHS
      table (MCD-IL-ACA-ADULT).
  - cases: [MCD-CA-T03]
    match: {state: ca}
    reason: >-
      Rounding of the 138% FPL monthly limit for three. California's chart
      (Santa Clara County FPL chart, 2026) shows $3,143 for three, which
      appears to round the monthly guideline first ($27,320/12 = $2,277 x
      1.38 = $3,142.26, rounded up); PolicyEngine rounds 138% of the annual
      guideline once ($3,141.84 -> $3,142). At $3,143 the archive (following
      the California table, MCD-CA-MAGI-ADULT) says eligible, PolicyEngine not.
  - cases: [MCD-CA-T09, MCD-IL-T09]
    reason: >-
      Asset test at exactly the limit. PolicyEngine's
      is_optional_senior_or_disabled_asset_eligible requires assets strictly
      below the limit ("assets < asset_limit"). The California county handbook
      says the property reserve "must be equal to or below the limit"
      (MCD-CA-ASSET-LIMIT; conflict MCD-CA-CONFLICT-01), and the Illinois PM
      treats only amounts over $17,500 as excess (PM 15-02-02: "at least $1
      over the asset limit"). The archive treats the limit itself as passing.
  - cases: [MCD-NY-T07, MCD-NY-T09, MCD-NY-T11, MCD-NY-T13, MCD-X-01]
    match: {state: ny}
    reason: >-
      New York's SSI-related income level. PolicyEngine's New York
      senior_or_disabled income limit parameter is 82% FPL (and its asset
      limit $31,175 / $42,312 from 2024), the pre-2023 level. New York's 2026
      chart (GIS 26 MA/05 attachment) sets the SSI-related Medicaid income
      level at 138% FPL ($1,836 / $2,489) and resources $33,038 / $44,796
      (MCD-NY-SSI-RELATED-INCOME, MCD-NY-RESOURCE-LEVEL). These people are
      eligible without spenddown under New York's current levels.
  - cases: [MCD-NY-T08, MCD-NY-T10, MCD-NY-T12, MCD-X-00]
    match: {state: ny}
    reason: >-
      Spenddown not modelled by PolicyEngine. The archive reports New York's
      Excess Income program (income over $1,836, MCD-NY-EXCESS-INCOME) and
      excess-resource spenddown (MCD-NY-EXCESS-RESOURCES) as eligible with a
      spenddown amount; PolicyEngine's medically needy category requires
      income under its (outdated) medically needy limit and has no spenddown,
      so it reports not eligible. Also its 82% FPL senior limit (see above).
  - cases: [MCD-CA-T12]
    match: {state: ca}
    reason: >-
      Share of cost not modelled. Income $2,500 is over the A&D FPL limit; the
      archive reports Medically Needy Medi-Cal with a $1,677.10 monthly share
      of cost (MCD-CA-SHARE-OF-COST). PolicyEngine's California medically
      needy pathway only admits income under the $600 maintenance need and
      has no share-of-cost spenddown, so it reports not eligible.
  - cases: [MCD-IL-T08, MCD-IL-T10, MCD-IL-T11, MCD-IL-T12, MCD-IL-T13, MCD-X-00]
    match: {state: il}
    reason: >-
      Illinois spenddown not modelled. Over the AABD income standard ($1,330)
      or the $17,500 asset limit, an Illinois community case is enrolled in
      spenddown rather than denied (PM 15-02-02, PM 15-04-01;
      MCD-IL-SPENDDOWN); the archive reports eligible with the spenddown
      amount. PolicyEngine's medically_needy flag for Illinois is false, so
      it reports not eligible.
