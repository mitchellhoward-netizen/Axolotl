# Why archive results differ from PolicyEngine US for the Medicare Savings Program.
# Each entry names the cases it covers. crosscheck/run.py fails on any difference not listed.
explanations:
  - cases: [MSP-NY-T01, MSP-NY-T02, MSP-NY-T03, MSP-NY-T04, MSP-NY-T06, MSP-NY-T07, MSP-NY-T08, MSP-NY-T10,
            MSP-NY-T13, MSP-NY-T16, MSP-NY-T17, MSP-NY-T19, MSP-NY-T23, MSP-X-01]
    match: {state: ny}
    reason: >-
      New York policy, not a logic difference. PolicyEngine models only the
      federal-minimum tiers (QMB <=100%, SLMB <120%, QI <135% FPL); New York set
      QMB at <=138% and QI at >138%-<=186% FPL from 2023 (GIS 22 MA/10; 2026
      chart in GIS 26 MA/05). Our federal-minimum column matches PolicyEngine
      on every one of these households, so the shared income counting agrees.
  - cases: [MSP-NY-T11]
    reason: >-
      Input-model difference. The household is 66 with no Medicare Part A.
      PolicyEngine infers Medicare eligibility from age (is_medicare_eligible =
      age >= 65) and has no Part A entitlement input, so it assigns QMB. The
      archive requires Part A entitlement (42 U.S.C. 1396d(p)(1)(A)); in New
      York this person could get QMB by using the Part A Buy-in (case
      MSP-NY-T12).
