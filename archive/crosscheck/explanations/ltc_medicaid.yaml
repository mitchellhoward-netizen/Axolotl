# Why archive results differ from PolicyEngine US for long-term care Medicaid.
# Only the home equity test is compared (PolicyEngine models nothing else of LTC Medicaid).
# crosscheck/run.py fails on any difference not listed here.
explanations:
  - cases: [LTC-IL-T08]
    match: {state: il}
    reason: >-
      State policy choice, not a logic difference. PolicyEngine uses one national home equity limit, the
      federal maximum ($1,130,000 in 2026, parameter gov.hhs.medicaid.eligibility.long_term_care.home_equity.limit),
      for every state. Illinois elected the federal minimum: $752,000 for 2026 (IDHS WAG 25-03-02 (2), PM
      07-02-04-a). The household's $760,000 equity is between the two, so Illinois denies long-term care and
      PolicyEngine does not. Our federal-minimum column (federal maximum limit) matches PolicyEngine.
  - cases: [LTC-CA-T11, LTC-IL-T08]
    match: {state: ca}
    reason: >-
      Archive gap, recorded as unresolved. Whether California applies the home equity limit before 2028 is an
      open question (LTC-CA-OQ-01, conflict LTC-CA-CONFLICT-01: federal statute 42 U.S.C. 1396p(f) versus
      Justice in Aging's statement that California does not apply it yet), so the archive returns
      "undetermined" for California households with equity above the $752,000 federal minimum and nobody
      qualifying in the home. PolicyEngine applies its national $1,130,000 limit and finds $900,000 / $760,000
      within it.
