# California State Supplementary Payment (SSP) levels. SSA administers
# California's SSP, so the levels are published in POMS SI 01415.058 (January
# 2026). Each value is the STATE supplement level: the SSP paid to someone
# whose countable income is not more than the federal benefit rate (FBR).
# Countable income above the FBR reduces the SSP dollar for dollar.
parameters:
  - id: ca.ssp.payment_level_individual
    description: >-
      California optional state supplement level for an eligible individual,
      by California living-arrangement code (A independent living with
      cooking; B non-medical out-of-home care; C independent living without
      cooking facilities; D household of another, federal VTR applies; F
      out-of-home care in the household of another; J Title XIX medical
      facility) and category.
    compare_to: >-
      Excess countable income = SSI countable income minus the federal benefit
      rate in effect (FBR, or FBR less VTR for code D/F). The SSP is the level
      minus the excess; no SSP if the excess equals or exceeds the level.
    unit: usd_per_month
    keyed_by: "oss code -> category (aged | blind | disabled | all)"
    updates: State budget; SSA publishes the January levels in POMS SI 01415.0xx each year.
    values:
      - effective_from: 2026-01-01
        value:
          A: {aged: 239.94, blind: 324.32, disabled: 239.94}
          B: {all: 632.07}
          C: {aged: 368.81, disabled: 368.81}
          D: {aged: 245.20, blind: 329.58, disabled: 245.20}
          F: {all: 624.40}
          J: {all: 32.00}
        confidence: confirmed
        note: "Total payment levels in the same table: A aged/disabled $1,233.94, A blind $1,318.32, B $1,626.07, C $1,362.81, D aged/disabled $907.87 (FBR less VTR $662.67 + $245.20). CDSS's 2026 May Revision tables show the same $1,234 maximum grant for an aged/disabled individual for January 2026."
        sources:
          - {source: ssa-poms-si-01415-058, locator: "B.2.a Recipient payment levels for California effective January 1, 2026: Federal code A / State code A Aged 994.00 239.94 1233.94; Blind 994.00 324.32 1318.32; B All 632.07; C Aged/Disabled 368.81; Federal code B / State code D Aged 662.67 245.20 907.87, Blind 329.58; F All 624.40; D / J All 30.00 32.00"}
          - {source: ca-cdss-2026mr-ssp-grant, locator: "SSI/SSP Maximum Grant Comparison for Individuals: maximum grant $1,234 (January 2026), based on the Aged/Disabled Individual Payment Standard"}
  - id: ca.ssp.payment_level_couple
    description: California optional state supplement level for an eligible couple, by living-arrangement code and the two members' categories.
    compare_to: >-
      Couple's combined countable income minus the couple FBR (or couple FBR
      less VTR for code D/F). The SSP is the level minus that excess.
    unit: usd_per_month
    keyed_by: "oss code -> categories joined with '/' in alphabetical order (aged/aged, aged/blind, aged/disabled, blind/blind, blind/disabled, disabled/disabled) or all"
    updates: State budget; POMS SI 01415.0xx each January.
    values:
      - effective_from: 2026-01-01
        value:
          A: {aged/aged: 607.83, blind/blind: 833.35, disabled/disabled: 607.83, aged/blind: 747.44, aged/disabled: 607.83, blind/disabled: 747.44}
          B: {all: 1761.14}
          C: {aged/aged: 865.57, disabled/disabled: 865.57, aged/disabled: 865.57}
          D: {aged/aged: 615.70, blind/blind: 841.22, disabled/disabled: 615.70, aged/blind: 755.31, aged/disabled: 615.70, blind/disabled: 755.31}
          F: {all: 1604.20}
          J: {all: 64.00}
        confidence: confirmed
        note: "Total couple levels: A aged/aged $2,098.83 (CDSS May Revision: $2,099 maximum couple grant, January 2026); B $3,252.14; C $2,356.57; D aged/aged $1,609.70."
        sources:
          - {source: ssa-poms-si-01415-058, locator: "B.2.b Couple payment levels for California: A Aged/Aged 1491.00 607.83 2098.83; Blind/Blind 833.35; Aged/Blind 747.44; B All 1761.14; C Aged/Aged 865.57; D Aged/Aged 994.00 615.70 1609.70; Blind/Blind 841.22; F All 1604.20; J All 60.00 64.00"}
          - {source: ca-cdss-2026mr-ssp-grant, locator: "SSI/SSP Maximum Grant Comparison for Couples: $2,099 (January 2026)"}
