    title: 18 NYCRR 398-1.1 — State Supplement Program, scope and purpose (third-party copy)
    kind: secondary
    jurisdiction: ny
    doc_type: regulation
    effective_date: 2014-10-01
    note: Third-party hosting of OTDA's SSP regulation (Part 398 adopted NYS Register September 24, 2014, eff. 10/1/2014; amended eff. 1/13/2021, per LII's notes). The official NYCRR (govt.westlaw.com) and NYS Register (dos.ny.gov) refused scripted and browser requests.
