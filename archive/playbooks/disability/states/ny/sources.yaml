# New York sources for the Disability playbook. otda.ny.gov refused every
# scripted and headless-browser request on 2026-10-07 (empty reply or
# "upstream connect error"), so OTDA's own SSP page and benefit chart could not
# be saved. The SSP amounts rest on the statute (Social Services Law 209, from
# nysenate.gov, saved with a headless browser because the site requires
# JavaScript) and NY DOH's GIS 26 MA/03 (already in the MSP playbook).
# Second pass (same day): otda.ny.gov still served only an F5 JavaScript
# challenge to Playwright (headful under Xvfb, desktop user agent, network-idle
# waits) and HTTP 503 to WebFetch; web.archive.org was unreachable; a NY DOH
# Dear Administrator Letter on the 2014 change (DAL 14-23) returned 404/403.
# OTDA's SSP regulation, 18 NYCRR Part 398, was found in Cornell LII's copy
# (secondary: third-party hosting).
sources:
  - id: ny-ssl-209
    retrieved: 2026-10-07
    url: https://www.nysenate.gov/legislation/laws/SOS/209
    publisher: New York State Senate (Consolidated Laws, Social Services Law)
    title: New York Social Services Law § 209 — Eligibility (additional state payments; standard of monthly need)
    kind: primary
    jurisdiction: ny
    doc_type: statute
    note: Page lists amendment dates through 2026. Fetched with a headless browser (site requires JavaScript) and imported.
  - id: ny-senate-ssp-takeover-2014
    retrieved: 2026-10-07
    url: https://www.nysenate.gov/newsroom/articles/2014/andrea-stewart-cousins/state-supplement-program-state-takeover
    publisher: New York State Senate (office of Senator Andrea Stewart-Cousins)
    title: State Supplement Program State Takeover of Administration on October 1, 2014
    kind: secondary
    jurisdiction: ny
    doc_type: news
    published: 2014-09-30
    note: A legislator's newsroom post quoting an OTDA notice; OTDA's own pages could not be retrieved. Treated as secondary.
  - id: ny-budget-otda-2006
    retrieved: 2026-10-07
    url: https://www.budget.ny.gov/pubs/archive/fy0607archive/fy0607app1/tda.pdf
    publisher: New York State Division of the Budget
    title: 2006-07 Executive Budget, Office of Temporary and Disability Assistance (agency presentation)
    kind: primary
    jurisdiction: ny
    doc_type: other
    note: Old (fiscal year 2006-07) but an official state document naming OTDA's Division of Disability Determinations.
  - id: ny-nycrr-398-1-1-lii
    retrieved: 2026-10-07
    url: https://www.law.cornell.edu/regulations/new-york/18-NYCRR-398-1.1
