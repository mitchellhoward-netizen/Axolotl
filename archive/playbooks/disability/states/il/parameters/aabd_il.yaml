# Illinois AABD cash (Illinois's state supplement to SSI). Illinois runs it
# itself through IDHS (not through SSA). The AABD Cash Assistance Standard is
# built per person from allowances; the payment is the standard minus the
# client's nonexempt income (SSI included) after the $25 exemption.
# Several IDHS Workers' Action Guide (WAG) pages carry no effective date; their
# values are recorded as in force on the retrieval date (2026-10-07) and
# flagged with DIS-IL-OQ-02.
parameters:
  - id: il.aabd.grant_adjustment_monthly
    description: >-
      AABD "grant adjustment" allowance: the sum of all SSI benefit increases
      since July 1977, added to every community AABD cash client's needs.
      ($28 instead for sheltered care or homes not subject to licensing; none
      in long-term care.)
    unit: usd_per_month
    updates: Each January with the SSI increase.
    values:
      - effective_from: 2025-01-01
        effective_to: 2025-12-31
        value: 788.90
        confidence: confirmed
        sources:
          - {source: il-dhs-wag-25-06-01, locator: "AABD Grant Adjustment Changes: 01/01/2025-12/31/2025 788.90"}
      - effective_from: 2026-01-01
        value: 816.90
        confidence: confirmed
        sources:
          - {source: il-dhs-pm-11-01-07, locator: "authorize a grant adjustment of: $816.90 for January 2026 and after"}
  - id: il.aabd.personal_allowance_monthly
    description: >-
      AABD personal allowance (food, clothing, household supplies, personal
      essentials) per client, by activity level and number of persons eating
      together.
    unit: usd_per_month
    keyed_by: "active | bedfast -> persons eating together (1, 2, 3-7, 8+)"
    updates: Rarely; set by IDHS.
    open_question: DIS-IL-OQ-02
    values:
      - effective_from: 2026-01-01
        value:
          active: {"1": 62.43, "2": 57.25, "3-7": 53.71, "8+": 52.91}
          bedfast: {"1": 48.11, "2": 43.97, "3-7": 40.67, "8+": 39.96}
        confidence: confirmed
        note: WAG 11-01-01 is undated; the values are those published on the retrieval date. The 2026-01-01 start is the earliest date this archive vouches for, not the date IDHS adopted them.
        sources:
          - {source: il-dhs-wag-11-01-01, locator: "PERSONAL ALLOWANCE CHART, Client (Active): 1 $62.43; 2 57.25; 3-7 53.71; 8 or more 52.91. Client (Bedfast): 1 $48.11; 2 43.97 ..."}
  - id: il.aabd.shelter_maximum_monthly
    description: Maximum AABD shelter allowance per dwelling (rent, or prorated mortgage, taxes and insurance on a home the client owns); shared living arrangements divide it by the number of persons in the dwelling.
    unit: usd_per_month
    updates: Rarely.
    open_question: DIS-IL-OQ-02
    values:
      - effective_from: 2026-01-01
        value: 97
        confidence: confirmed
        note: PM 11-01-02 is undated; value as published on the retrieval date.
        sources:
          - {source: il-dhs-pm-11-01-02, locator: "Rent: The maximum rent allowance for a dwelling is $97 ... Allow the lesser of the $97 maximum, or the annual property expenses ... prorated on a monthly basis."}
  - id: il.aabd.utility_allowance_monthly
