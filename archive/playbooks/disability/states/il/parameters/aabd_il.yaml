  - id: il.aabd.income_exemption_monthly
    description: First $25 of earned or unearned income exempt for AABD cash (one $25 per client, not for contributions).
    unit: usd_per_month
    updates: Rarely.
    open_question: DIS-IL-OQ-02
    values:
      - effective_from: 2026-01-01
        value: 25
        confidence: confirmed
        note: PM 11-01-13 is undated; value as published on the retrieval date.
        sources:
          - {source: il-dhs-pm-11-01-13, locator: "The first $25 of earned or unearned income is exempt, except for contributions. Only one $25 exemption is allowed"}
  - id: il.aabd.cash_resource_limit
    description: AABD cash resource (asset) limit.
    compare_to: Nonexempt resources of the AABD cash unit (cash and nonliquid nonexempt resources, e.g. cash value of a nonexempt life insurance policy).
    unit: usd
    keyed_by: "persons: 1, 2 (3+ = $3,000 + $50 per additional person)"
    updates: Rarely.
    values:
      - effective_from: 2023-05-12
        value: {1: 2000, 2: 3000}
        confidence: confirmed
        note: PM 07-02-01 says this cash limit is also the AABD limit that applied before 05/12/2023 (when the AABD medical limit became $17,500); it does not give the cash limit's own start date.
        sources:
          - {source: il-idhs-pm-07-02-01, locator: "The resource limit for AABD Cash is below ... one person - $2,000; 2 persons - $3,000"}
  - id: il.aabd.minimum_payment_monthly
    description: Minimum AABD cash payment for a person in the community; the client qualifies only if needs exceed nonexempt income by at least this amount.
    unit: usd_per_month
    updates: Rarely.
    open_question: DIS-IL-OQ-02
    values:
      - effective_from: 2026-01-01
        value: 1
        confidence: confirmed
        sources:
          - {source: il-dhs-pm-11-02-02, locator: "The minimum payment for a person living in the community is $1."}
          - {source: il-dhs-pm-11-02-03, locator: "A client qualifies for AABD Cash benefits when their nonexempt income minus allowable disregards, is less than their needs by at least $1"}
