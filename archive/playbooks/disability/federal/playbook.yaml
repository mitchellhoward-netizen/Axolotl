open_questions:
  - id: DIS-FED-OQ-01
    priority: medium
    question: >-
      When countable income exactly equals the FBR (eligible under SI 02005.001
      C.3 but $0 federal payment), does SSA treat the person as an SSI
      recipient for Medicaid (1634 states), Extra Help and SNAP categorical
      eligibility, or only for state supplement purposes?
    why_it_matters: A member at the breakeven could be told they "qualify for SSI" when no check comes, or miss linked Medicaid.
    checked: [SI 02005.001, 42 U.S.C. 1382(a), SI 01715.010]
    affects: [DIS-FED-SSI-BREAKEVEN]
    status: open
  - id: DIS-FED-OQ-02
    priority: medium
    question: Has SSA revised POMS SI 00835.020 / SI 00835.200 (and related ISM sections) for the September 30, 2024 food change, or does EM-24047 remain the operative instruction?
    why_it_matters: Field staff and advocates quoting POMS may still describe food as ISM.
    checked: [SI 00835.020 (TN 108 08-23), SI 00835.200 (TN 118 05-24), EM-24047 REV (retention 02/11/2027), 89 FR 21199]
    affects: [DIS-FED-SSI-ISM-FOOD-2024, DIS-FED-SSI-VTR]
    status: open
  - id: DIS-FED-OQ-03
    priority: low
    question: Current versions and online availability of SSA-8000, SSA-16, SSA-3368 (i3368), SSA-827 and SSA-561, and the contents of the SSDI award notice — www.ssa.gov forms pages returned HTTP 403 to every retrieval method on 2026-10-07.
    why_it_matters: The agent links members to forms and tells them what the award letter shows.
    checked: [ssa.gov/forms/ssa-8000.html, ssa-16.html, ssa-3368.html, ssa-827.html, ssa-561.html (all 403); POMS SI 00604.001, DI 11005.020, DI 11005.055, GN 03102.200]
    affects: [DIS-FED-PROC-SSI-APPLY, DIS-FED-PROC-SSDI-APPLY, DIS-FED-PROOF-SSDI-AWARD]
    status: open
  - id: DIS-FED-OQ-04
    priority: medium
    question: Confirm the SSDI retroactivity limit (12 months before the filing month, 20 CFR 404.621) and how it combines with the 17-month waiting-period look-back.
    why_it_matters: Members who file late lose back months; the agent should say how many.
    checked: [POMS DI 10105.070]
    affects: [DIS-FED-SSDI-WAITING-PERIOD]
    status: open
  - id: DIS-FED-OQ-05
    priority: high
    question: >-
      Which other unearned-income rules should the evaluator apply — VA
      pension and other income based on need (no $20), one-third of child
      support for a child, infrequent/irregular income ($60 a quarter), and
      exclusions under other federal laws (SI 00830.099)?
    why_it_matters: A retiree with a VA needs-based pension would be over-paid by $20 a month in the evaluator; other exclusions could change eligibility.
    checked: [SI 00810.420, SI 00820.500]
    affects: [DIS-FED-SSI-IBON, DIS-FED-SSI-INCOME-EXCLUSIONS]
    status: open
  - id: DIS-FED-OQ-06
    priority: medium
    question: >-
      SSI and SSDI work incentives beyond the TWP — section 1619(a)/(b) (SSI
      continuing above SGA, Medicaid while working), the SSDI extended period
      of eligibility, expedited reinstatement — and their 2026 thresholds; the
      SSA Red Book (ssa.gov/redbook) returned 403.
    why_it_matters: Members with a disability who work need to know they can keep SSI or Medicaid.
    checked: [ssa.gov/redbook (403), DI 13010.035, DI 13010.060]
    affects: [DIS-FED-SSI-SGA-INITIAL, DIS-FED-SSDI-TWP]
    status: open
  - id: DIS-FED-OQ-07
    priority: low
    question: Primary sources for typical DDS decision times, appeal-level processing times, SSI redetermination frequency and continuing disability review schedules.
    why_it_matters: Members ask how long the decision will take and when they will be reviewed again.
    checked: [DI 00115.001, GN 03101.001]
    affects: [DIS-FED-TIME-DECISION, DIS-FED-RENEW-REPORT]
    status: open

conflicts:
  - id: DIS-FED-CONFLICT-01
    topic: Whether food counts as in-kind support and maintenance
    claims:
      - source: ssa-poms-si-00835-020
        locator: "B.16"
        says: In-kind support and maintenance (ISM) is unearned income in the form of food, or shelter or any combination of these.
      - source: ssa-poms-si-00835-200
        locator: "A.1"
        says: The VTR applies when a claimant lives in another person's household and receives both food and shelter from others living in the household.
      - source: fr-2024-06464
        locator: "DATES; summary"
        says: Effective September 30, 2024, food is omitted from ISM calculations; only shelter is considered.
      - source: ssa-em-24047-rev
        locator: "B.1"
        says: Effective September 30, 2024, food is no longer part of the ISM calculations; determine pro rata share and ISM using shelter expenses only.
    handling: >-
      The archive follows the final rule and EM-24047 (shelter only from
      September 30, 2024). The POMS pages appear not to have been revised.
    affects: [DIS-FED-SSI-ISM-FOOD-2024, DIS-FED-SSI-VTR, DIS-FED-SSI-ISM-PMV]
    status: open

claims_checked:
  - claim: A September 30, 2024 rule excluded food from in-kind support and maintenance.
    verdict: verified
    detail: Final rule 89 FR 21199 (March 27, 2024), effective September 30, 2024; SSA EM-24047 REV gives technician instructions. POMS SI 00835 pages still mention food (DIS-FED-CONFLICT-01).
    sources:
      - {source: fr-2024-06464, locator: "DATES"}
      - {source: ssa-em-24047-rev, locator: "B.1"}
  - claim: SSA www pages (ssa.gov/oact and others) refuse scripts; secure.ssa.gov/poms.nsf works.
    verdict: verified
    detail: ssa.gov forms pages and the Red Book returned 403 to the fetcher and to WebFetch; POMS pages on secure.ssa.gov were retrieved normally.
  - claim: The SSA appeal steps are reconsideration, ALJ hearing and Appeals Council, each with a 60-day deadline.
    verdict: verified
    detail: 20 CFR 404.900 lists the steps (plus federal court); GN 03101.010 gives 60 days from receipt, with receipt presumed 5 days after the notice date.
    sources:
      - {source: cfr-20-404-900, locator: "(a)"}
      - {source: ssa-poms-gn-03101-010, locator: "A.1"}
  - claim: SSI deems Extra Help; SSDI leads to Part A after 24 months and then to the Medicare Savings Programs.
    verdict: verified
    detail: HI 03001.005 lists SSI recipients as deemed subsidy eligibles; 42 U.S.C. 426(b) starts Part A with the 25th month of disability entitlement.
    sources:
      - {source: ssa-poms-hi-03001-005, locator: "A."}
      - {source: usc-42-426, locator: "(b)"}
  - claim: SSDI converts to retirement at full retirement age.
    verdict: verified
    detail: GN 00201.005 B.1.a lists DIB-to-RIB conversion among entitlement conversions that need no application.
    sources: [{source: ssa-poms-gn-00201-005, locator: "B.1.a"}]
  - claim: Insured status cannot be computed without the earnings record.
    verdict: verified
    detail: RS 00301.120 defines DIB insured status by quarters of coverage in a 40-quarter window and fully insured status, which only SSA's record shows; the archive takes it as an input.
    sources: [{source: ssa-poms-rs-00301-120, locator: "A.1"}]
  - claim: 2026 SGA and TWP amounts.
    verdict: verified
    detail: SGA $1,690 non-blind / $2,830 blind (DI 10501.015); TWP service month over $1,210 (DI 13010.060).
    sources:
      - {source: ssa-poms-di-10501-015, locator: "Tables 2 and 3"}
      - {source: ssa-poms-di-13010-060, locator: "A."}
