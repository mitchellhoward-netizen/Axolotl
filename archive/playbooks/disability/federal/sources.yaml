# Federal sources for the Disability playbook (SSI and Social Security
# disability insurance). SSA POMS is served by secure.ssa.gov, which answers
# scripted requests; www.ssa.gov (forms pages, Red Book, OACT) returns 403 to
# scripts and to the research fetcher, so forms are documented from the POMS
# sections that describe them. CFR text comes from the annual edition on
# govinfo.gov (eCFR refuses scripts).
# Snapshots: playbooks/disability/snapshots/<id>/. `retrieved` is set by tools/sources.py.
