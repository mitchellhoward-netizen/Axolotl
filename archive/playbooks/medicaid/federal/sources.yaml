# Federal sources for the Medicaid (enrollment and renewal) playbook.
# Snapshots: playbooks/medicaid/snapshots/<id>/. `retrieved` is set by tools/sources.py.
# Also cited from other parts of the archive (not duplicated here):
#   usc-42-1396a, usc-42-1396d (playbooks/msp/federal), fr-2026-hhs-poverty-guidelines,
#   usc-42-1382a, cms-2026-part-a-b-premiums (shared/).
# The eCFR pages are fetched through eCFR's public renderer API, because the
# www.ecfr.gov site refuses scripted requests.
sources:
  - id: pl-119-21-medicaid
    retrieved: 2026-10-07
    url: https://www.govinfo.gov/content/pkg/PLAW-119publ21/html/PLAW-119publ21.htm
    publisher: U.S. Government Publishing Office (Public and Private Laws)
    title: Public Law 119-21 (July 4, 2025), Title VII, Subtitle B, Chapter 1 — Medicaid (secs. 71101-71121)
    kind: primary
    jurisdiction: federal
    doc_type: statute
    published: 2025-07-04
    note: >-
      Enacted text of the 2025 reconciliation law ("One Big Beautiful Bill
      Act"; CMS calls it the "Working Families Tax Cut" legislation). The 2023
      edition of the U.S. Code on govinfo predates it, so the amended
      Social Security Act sections are cited from this text. Key sections:
      71107 (6-month redeterminations), 71109 (alien eligibility), 71112
      (retroactive coverage), 71119 (community engagement), 71120 (cost sharing).
