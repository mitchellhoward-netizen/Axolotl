# California sources for the Medicaid (Medi-Cal) playbook.
#
# DHCS primaries. www.dhcs.ca.gov sits behind an Incapsula bot wall that
# refuses scripted requests; the second pass (2026-10-07) fetched every DHCS
# letter below with a headless Chromium browser (Playwright) and recorded it
# with `python -m tools.sources import`. DHCS letters already snapshotted by
# the msp and ltc_medicaid playbooks (ca-dhcs-acwdl-25-14, -25-01, -26-01,
# -26-07, -26-16, ca-dhcs-fpl-2026-monthly, ca-dhcs-fpl-2026-programs,
# ca-dhcs-mepm-5l, ...) are cited by their existing global IDs and are not
# repeated here.
#
# County sources. The first pass rested on Santa Clara County's Medi-Cal
# handbook and charts (and a San Mateo County flyer) because DHCS could not
# be reached. A county restatement is not the rule-maker's text, so these are
# now recorded as kind: secondary and kept only as cross-checks next to the
# DHCS letter that each rule cites. The Health Consumer Alliance practice tip
# is secondary (advocacy).
