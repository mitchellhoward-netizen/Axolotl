# California sources for the Medicaid (Medi-Cal) playbook.
#
# DHCS (www.dhcs.ca.gov, incl. sps2016.dhcs.ca.gov and the ACWDL/MEDIL
# letters) sits behind an Incapsula bot wall: scripted requests, the
# WebFetch research tool and the Wayback Machine all failed on 2026-10-07.
# No DHCS original could be snapshotted. The California part therefore
# rests on the Medi-Cal eligibility handbook and charts of the Santa Clara
# County Social Services Agency (a county that administers Medi-Cal for
# DHCS), which restate the DHCS letters and name them (ACWDL 25-13, 25-14,
# 25-20). These are official agency manuals of an administering agency, so
# they are recorded as primary, but every rule resting on them carries the
# open question CA-OQ-01 (retrieve the DHCS original). A secondary advocacy
# summary (Health Consumer Alliance) is kept for cross-checking only.
