  - id: ca.medi_cal.ad_fpl_income_limit_monthly
    description: Aged, Blind & Disabled FPL program income limit (138% FPL), monthly; zero share of cost Medi-Cal for people 65+, blind or disabled not in long-term care.
    compare_to: >-
      Countable income after the $20 any-income deduction, the
      $65-plus-one-half earned income deduction, health insurance premiums,
      the Medicare Part B premium disregard (whoever pays the premium) and a
      maintenance need deduction for a spouse not in Medi-Cal; "equal to or
      less than" the limit (ACWDL 20-24). One person or a non-applicant
      spouse's budget uses the 1-person figure; two applicant spouses use the
      2-person figure.
    unit: usd_per_month
    keyed_by: household_size (1 = individual, 2 = couple)
    open_question: MCD-CA-OQ-02
    updates: Each year by the FPL ACWDL; ABD FPL levels effective April 1.
    values:
      - effective_from: 2025-01-01
        effective_to: 2025-03-31
        value: null
        confidence: unresolved
        open_question: MCD-CA-OQ-02
        note: January-March 2025 used the 2024 levels (ACWDL 24-xx, not retrieved).
      - effective_from: 2025-04-01
        effective_to: 2026-03-31
        value: {1: 1801, 2: 2433}
        confidence: confirmed
        note: Applies until the 2026 levels take effect for ABD on April 1, 2026 (ACWDL 26-01). During January-March the January Social Security COLA is disregarded (ACWDL 20-24); see MCD-CA-AD-FPL-COLA.
        sources:
          - source: ca-dhcs-acwdl-25-01
            locator: "Enclosure 1, 138% column (1: 1801; 2: 2433); page 1: ABD FPL programs ... effective date of the revised FPL figures is April 1, 2025"
          - source: ca-dhcs-acwdl-26-01
            locator: "page 2: ABD FPL programs ... effective date of the revised FPL figures is April 1, 2026"
      - effective_from: 2026-04-01
        value: {1: 1836, 2: 2490}
        confidence: confirmed
        sources:
          - source: ca-dhcs-fpl-2026-monthly
            locator: "138% column, family size 1 and 2"
          - source: ca-dhcs-fpl-2026-programs
            locator: "138% FPL = ACA New Adults Ages 19-64; and = FPL Program for Aged & Disabled"
          - source: ca-dhcs-acwdl-26-01
            locator: "page 2: ABD FPL programs ... April 1, 2026"
  - id: ca.medi_cal.non_magi_income_deduction_monthly
    description: The $20 any-income deduction Medi-Cal allows from unearned (then earned) income in Non-MAGI budgets (A&D FPL and Medically Needy).
    unit: usd_per_month
    updates: Fixed.
    values:
      - effective_from: 2020-12-01
        value: 20
        confidence: confirmed
        note: Start date is the effective date of ACWDL 20-24, which restates the deduction; the deduction is older (MEPM Article 5L examples, 1997).
        sources:
          - {source: ca-dhcs-acwdl-20-24, locator: "ABD FPL Program Reminders: the $20.00 Any Income deduction", quote: "Any Income deduction - $20.00"}
          - {source: ca-dhcs-mepm-5l, locator: "Medi-Cal Share of Cost Determination examples", quote: "- $ 20 Any Income Deduction"}
  - id: ca.medi_cal.non_magi_asset_test_applies
    description: Whether Medi-Cal counts property for Non-MAGI programs (aged, blind, disabled, long-term care, MSP, AFDC-Medically Needy), except Pickle, Disabled Adult Child and Disabled Widow(er), which have no asset test until January 1, 2027.
    unit: boolean
    updates: State law (AB 133 of 2021 phase-out; AB 116 of 2025 reinstatement).
    values:
      - effective_from: 2022-07-01
        effective_to: 2023-12-31
        value: true
        confidence: confirmed
        sources:
          - {source: ca-dhcs-acwdl-25-14, locator: "Background: The first phase, which was effective July 1, 2022, increased the asset limits to $130,000"}
      - effective_from: 2024-01-01
        effective_to: 2025-12-31
        value: false
        confidence: confirmed
        sources:
          - {source: ca-dhcs-acwdl-25-14, locator: "Background: The second phase, effective January 1, 2024, eliminated the asset limits for Non-MAGI programs"}
          - {source: ca-dhcs-acwdl-22-25, locator: "Elimination of Asset Limits for Non-MAGI Medi-Cal Programs"}
      - effective_from: 2026-01-01
        value: true
        confidence: confirmed
        sources:
          - {source: ca-dhcs-acwdl-25-14, locator: "Policy Change: No sooner than January 1, 2026, the asset test shall be reinstated for Non-MAGI programs, including LTC and MSPs, except for the Pickle, DAC, and DW programs"}
          - {source: ca-dhcs-medil-i26-03, locator: "the asset test will be reinstated ... effective January 1, 2026"}
          - {source: ca-scc-mc-update-2025-9-asset-limits, locator: "Changes and Implementation Dates (county cross-check)"}
  - id: ca.medi_cal.non_magi_asset_limit
    description: Medi-Cal Non-MAGI property limit ($130,000 for one person plus $65,000 for each additional person in the Medi-Cal Family Budget Unit, up to 10 people).
    compare_to: >-
      Countable property of the MFBU; eligible when "at, or under" the limit
      (ACWDL 25-20) and ineligible when "above" it (ACWDL 25-14 notice
      snippets). Not counted: the home the person lives in, one vehicle,
      household items, retirement funds paying periodic payments or required
      minimum distributions (MEDIL I 25-23). The county handbook's separate
      $6,000 limit on other real property is not modelled.
    unit: usd
    keyed_by: household_size (persons in the MFBU, 1-10)
    updates: State law; unchanged since July 2022 except for the 2024-2025 elimination.
    values:
      - effective_from: 2022-07-01
        effective_to: 2023-12-31
        value: {1: 130000, 2: 195000, 3: 260000, 4: 325000, 5: 390000, 6: 455000, 7: 520000, 8: 585000, 9: 650000, 10: 715000}
        confidence: confirmed
        note: Sizes 3-10 computed from the stated $65,000 increment (the 2026 table in ACWDL 25-14 gives the same figures).
        sources:
          - {source: ca-dhcs-acwdl-25-14, locator: "Background: $130,000 for one person and $65,000 for each additional household member (up to a maximum of 10 people)"}
      - effective_from: 2026-01-01
        value: {1: 130000, 2: 195000, 3: 260000, 4: 325000, 5: 390000, 6: 455000, 7: 520000, 8: 585000, 9: 650000, 10: 715000}
        confidence: confirmed
        sources:
          - {source: ca-dhcs-acwdl-25-14, locator: "page 9: Household Asset Limits for Non-MAGI Programs as of January 1, 2026", quote: "1 person $130,000 2 people $195,000 ... 10 people $715,000"}
          - {source: ca-dhcs-acwdl-25-20, locator: "page 7: at, or under $130,000 for one person and $65,000 for each additional person (up to 10 maximum)"}
          - {source: ca-scc-mc-property-limits, locator: "Effective January 1, 2026 ... (county cross-check)"}
  - id: ca.medi_cal.maintenance_need_monthly
    description: Medi-Cal Medically Needy maintenance need level, monthly; net countable income above this is the share of cost. Also the A&D FPL deduction for a spouse not in Medi-Cal.
    unit: usd_per_month
    keyed_by: "persons in the MFBU (1-10); 2 = two adults ($934; 1 adult and 1 child is $750, not modelled); each person above 10 adds $14 (not modelled)"
    updates: >-
      Based on the former AFDC payment levels; unchanged since July 1, 1989.
      SB 184 (2022) would have raised it to 138% FPL from January 1, 2025
      (ACWDL 23-31), but ACWDL 24-10 (September 18, 2024) revoked that reform
      for budget reasons. No later DHCS letter (ACWDL or MEDIL lists for 2025
      and 2026, checked 2026-10-07) changes it.
    values:
      - effective_from: 1989-07-01
        value: {1: 600, 2: 934, 3: 934, 4: 1100, 5: 1259, 6: 1417, 7: 1550, 8: 1692, 9: 1825, 10: 1959}
        confidence: confirmed
        sources:
          - {source: ca-dhcs-acwdl-89-58, locator: "Enclosure: Maintenance Need Levels Effective July 1, 1989", quote: "1 Person in all situations $600"}
          - {source: ca-dhcs-acwdl-24-10, locator: "the Medi-Cal Share of Cost (SOC) reform outlined in ACWDL No. 23-31 is hereby revoked ... maintenance need will continue to be based on the AFDC program payment levels"}
          - {source: ca-dhcs-acwdl-23-31, locator: "The maintenance need has remained at $600 for an individual since 1989"}
          - {source: ca-scc-chart-maintenance-need, locator: "Effective 7/1/89 (county cross-check)"}
  - id: ca.medi_cal.uis_premium_monthly
    description: Monthly premium for adults 19-59 in state-funded full scope (no dental) Medi-Cal because of unsatisfactory immigration status, five-year-bar status or PRUCOL; not charged while pregnant or postpartum, to people 60+ or under 19, or in restricted scope.
    unit: usd_per_month
    updates: State law (AB 116 of 2025, W&I Code 14007.8); DHCS sets the start date.
    values:
      - effective_from: 2027-07-01
        value: 30
        confidence: confirmed
        note: '"Effective no sooner than July 1, 2027"; DHCS will contract a vendor to bill and collect. Not yet implemented on the archive date.'
        sources:
          - {source: ca-dhcs-acwdl-25-33, locator: "Implementation of Premiums: Effective July 1, 2027, the following impacted populations ages 19-59 will be subject to a $30 monthly premium"}
