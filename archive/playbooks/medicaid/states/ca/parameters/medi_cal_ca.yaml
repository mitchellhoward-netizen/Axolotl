        sources:
          - source: ca-dhcs-acwdl-25-01
            locator: "Enclosure 1, 2025 monthly values, 109% column; Enclosure 3: 109% FPL = ACA Parents and Caretaker Relatives"
      - effective_from: 2026-01-01
