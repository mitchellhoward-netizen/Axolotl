# California Medi-Cal income, property and premium standards, from the DHCS
# All County Welfare Directors Letters (ACWDLs). California applies each new
# year's FPL-based levels on different dates by population (ACWDL 26-01,
# 25-01): MAGI from January 1; MSP with RSDI income from March 1; the Aged,
# Blind and Disabled FPL program and the 250% Working Disabled Program from
# April 1. Santa Clara County's charts (secondary) agree with every DHCS
# figure below and are kept as a cross-check.
parameters:
  - id: ca.medi_cal.magi_adult_income_limit_monthly
    description: Medi-Cal MAGI income limit for the ACA new adult group (ages 19-64, 138% FPL), monthly; also the A&D FPL program level.
    compare_to: >-
      Monthly MAGI household income for the MAGI household size, compared
      directly ("=" in DHCS Enclosure 3: eligible if income is equal to or
      less than the limit); 138% is the 133% adult standard plus the 5% MAGI
      disregard (inference from the chart, which shows the 114% parent level
      as "109% FPL, Plus 5% MAGI Disregard").
    unit: usd_per_month
    keyed_by: household_size (1-12; "additional" = each person above 12)
    updates: Each year by ACWDL ("<year> Federal Poverty Levels"); MAGI levels effective January 1.
    values:
      - effective_from: 2025-01-01
        effective_to: 2025-12-31
        value: {1: 1801, 2: 2433, 3: 3065, 4: 3699, 5: 4331, 6: 4963, 7: 5596, 8: 6228, 9: 6860, 10: 7494, 11: 8126, 12: 8758, additional: 634}
        confidence: confirmed
        sources:
          - source: ca-dhcs-acwdl-25-01
            locator: "Enclosure 1, 2025 FPL Calculation Chart (Monthly Values), 138% column"
            quote: "1 15650 1305 783 1305 1410 1423 1488 1566 1671 1736 1762 1801 1854"
          - source: ca-dhcs-acwdl-25-01
            locator: "page 1: MAGI ... the new FPL figures are effective January 1, 2025"
      - effective_from: 2026-01-01
        value: {1: 1836, 2: 2490, 3: 3143, 4: 3795, 5: 4450, 6: 5102, 7: 5755, 8: 6409, 9: 7062, 10: 7715, 11: 8369, 12: 9022, additional: 655}
        confidence: confirmed
        sources:
          - source: ca-dhcs-fpl-2026-monthly
            locator: "ACWDL 26-01 Enclosure 1, 2026 FPL Calculation Chart (Monthly Values), 138% column"
          - source: ca-dhcs-acwdl-26-01
            locator: "page 2: For applicants and recipients whose Medi-Cal is determined based upon MAGI methodologies, the new FPL figures are effective January 1, 2026"
          - source: ca-scc-chart-fpl-2026
            locator: "2026 FPL Calculation Chart (Monthly Values), column 138% (county copy; cross-check)"
