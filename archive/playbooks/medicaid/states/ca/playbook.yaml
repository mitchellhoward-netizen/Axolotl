conflicts:
  - id: MCD-CA-CONFLICT-01
    topic: Whether property exactly at $130,000 qualifies
    claims:
      - source: ca-scc-mc-property-limits
        says: The property reserve must be equal to or below the limit for the number of people in the MFBU.
      - source: ca-hca-asset-limits-practice-tip-2026
        says: To get or keep coverage a single person must have countable assets less than $130,000.
    handling: The archive follows the county handbook (an administering agency's manual) and treats $130,000 as within the limit; the advocacy summary is secondary. Tests pin the at-limit case.
    affects: [MCD-CA-ASSET-LIMIT]
    status: open
  - id: MCD-CA-CONFLICT-02
    topic: Header of the reinstated property limit column
    claims:
      - source: ca-scc-chart-property-limits
        says: Column headed "Propert Limit Reinstatement January 1, 2024" with $130,000 for one person.
      - source: ca-scc-mc-update-2025-9-asset-limits
        says: Effective January 1, 2026, the asset limit is reinstated.
    handling: Treated as a typo in the chart header (the same chart says limits were eliminated January 1, 2024 through December 31, 2025); the archive uses January 1, 2026.
    affects: [ca.medi_cal.non_magi_asset_limit]
    status: resolved

claims_checked:
  - claim: California reinstated an asset limit for Medi-Cal, reported as $130,000 for one person.
    verdict: verified
    detail: >-
      Effective January 1, 2026, for Non-MAGI programs (aged, blind, disabled,
      long-term care and the Medicare Savings Programs; not Pickle, DAC or
      Disabled Widow(er)): $130,000 for one person plus $65,000 for each
      additional household member, up to 10 people ($195,000 for a couple).
      MAGI Medi-Cal has no asset test. The limits had been eliminated
      January 1, 2024 through December 31, 2025. Verified from Santa Clara
      County's handbook update citing ACWDL 25-14 and 25-20 and San Mateo
      County's member flyer; the DHCS letters themselves could not be
      retrieved (MCD-CA-OQ-01).
    sources:
      - {source: ca-scc-mc-update-2025-9-asset-limits, locator: "Changes and Implementation Dates"}
      - {source: ca-scc-mc-property-limits, locator: "Property Limits"}
  - claim: California's Medi-Cal application forms include the MC 210, MC 210 RV, MC 216 and SAWS 2 Plus.
    verdict: corrected
    detail: >-
      The MC 210 mail-in application is listed as outdated (no longer
      distributed, still accepted); the current paper application is the
      Single Streamlined Application. MC 216 is the MAGI renewal form and MC
      210 RV the Non-MAGI renewal form, not applications. SAWS 2 PLUS is the
      combined statement of facts for cash aid, CalFresh and Medi-Cal.
    sources:
      - {source: ca-scc-mc-application, locator: "Outdated but Acceptable Forms; SAWS 2 PLUS"}
      - {source: ca-scc-mc-rd-forms, locator: "MC 216; MC 210 RV"}
