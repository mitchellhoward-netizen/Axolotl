  - claim: California would raise the Medi-Cal share-of-cost maintenance need from $600 to 138% FPL in 2025.
    verdict: refuted
    detail: ACWDL 23-31 scheduled the increase for January 1, 2025 contingent on funding; ACWDL 24-10 (September 2024) revoked it. The maintenance need remains $600 for one person.
    sources:
      - {source: ca-dhcs-acwdl-24-10, locator: "hereby revoked"}
  - claim: California will charge undocumented adults a $30 monthly Medi-Cal premium starting in 2027.
    verdict: verified
    detail: ACWDL 25-33 — from no sooner than July 1, 2027, ages 19-59 in state-funded full scope with UIS, NQI (five-year bar) or PRUCOL status; not pregnant/postpartum people, 60+, children or restricted-scope members.
    sources:
      - {source: ca-dhcs-acwdl-25-33, locator: "Implementation of Premiums"}
