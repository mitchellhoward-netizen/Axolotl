open_questions:
  - id: MCD-CA-OQ-01
    priority: high
    question: >-
      Retrieve the DHCS originals (ACWDL 25-13 expansion freeze, ACWDL 25-14
      and 25-20 asset limit reinstatement, the 2026 FPL letter, the Medi-Cal
      eligibility procedures manual) and confirm the county handbook's
      restatement.
    why_it_matters: The first pass rested every California rule on a county restatement of DHCS letters.
    checked: [dhcs.ca.gov via headless Chromium (2026-10-07), ACWDL and MEDIL lists 2025 and 2026]
    affects: [MCD-CA-ASSET-LIMIT, MCD-CA-AD-FPL, MCD-CA-EXPANSION-FREEZE, MCD-CA-MAGI-ADULT]
    status: answered
    answer: >-
      Retrieved on 2026-10-07 with a headless browser: ACWDLs 20-18, 20-24,
      23-31, 24-10, 25-08, 25-13, 25-20, 25-25, 25-30, 25-33, 26-13, 26-14,
      89-58 and MEDILs I 25-23, I 25-24, I 26-01, I 26-03, I 26-18, I 26-20,
      plus the letters already snapshotted by the msp and ltc_medicaid
      playbooks (ACWDL 25-01, 25-14, 26-01, 26-07, 26-16 and the 2026 FPL
      enclosures). Every county figure matched DHCS except the dental cut
      date (MCD-CA-CONFLICT-04) and the scope of pregnancy coverage between
      138% and 213% FPL (MCD-CA-CONFLICT-03). County sources are now
      secondary cross-checks.
  - id: MCD-CA-OQ-02
    priority: medium
    question: >-
      How should an A&D FPL case in January-March be budgeted when the
      archive only knows the post-COLA Social Security benefit (DHCS
      disregards the January COLA until April), and what were the 2024 ABD
      FPL limits for January-March 2025?
    why_it_matters: January-March Non-MAGI cases that are over the prior year's limit with the COLA counted return undetermined; January-March 2025 dates return undetermined.
    checked: [ACWDL 20-24, ACWDL 25-01, ACWDL 26-01, ACWDL 25-22 title (2026 COLA)]
    affects: [ca.medi_cal.ad_fpl_income_limit_monthly, MCD-CA-AD-FPL-COLA, MCD-CA-FPL-DATES]
    status: open
  - id: MCD-CA-OQ-03
    priority: medium
    question: >-
      Does the $30 monthly premium from July 1, 2027 (ACWDL 25-33: UIS, NQI in
      the five-year bar, PRUCOL, ages 19-59) also apply to refugees, asylees
      and other qualified non-citizens who moved to state-funded full scope
      after October 1, 2026, and has DHCS confirmed the July 2027 start (the
      letter says "no sooner than")?
    why_it_matters: A refugee aged 19-59 could owe $30 a month from July 2027 or nothing.
    checked: [ACWDL 25-33, ACWDL 26-13, MEDIL I 26-20, MEDIL I 26-18]
    affects: [MCD-CA-UNDOC-PREMIUM, ca.medi_cal.uis_premium_monthly]
    status: open
  - id: MCD-CA-OQ-04
    priority: medium
    question: Confirm that the Medically Needy maintenance need is still $600/$934 in 2026.
    why_it_matters: Sets the share of cost for every Non-MAGI person over the A&D FPL limit.
    checked: [ACWDL 89-58, ACWDL 23-31, ACWDL 24-10, ACWDL and MEDIL lists for 2025 and 2026]
    affects: [MCD-CA-SHARE-OF-COST, ca.medi_cal.maintenance_need_monthly]
    status: answered
    answer: >-
      Yes. ACWDL 24-10 (September 18, 2024) revoked the SB 184 increase to
      138% FPL that ACWDL 23-31 had scheduled for January 1, 2025 and keeps the
      AFDC-based levels of ACWDL 89-58 ($600 for one, $934 for two adults).
      No 2025 or 2026 ACWDL or MEDIL title on the DHCS lists (checked
      2026-10-07) changes the maintenance need.
  - id: MCD-CA-OQ-05
    priority: high
    question: >-
      How does California classify lawfully present adults who are not
      qualified non-citizens (for example parolees for less than a year,
      people with TPS or pending applications) after October 1, 2026: PRUCOL
      with state-funded full scope, or unsatisfactory status under the
      expansion freeze (restricted scope)?
    why_it_matters: The evaluator returns undetermined for these members.
    checked: [ACWDL 25-13, ACWDL 26-13, MEDIL I 26-20, MEDIL I 25-27 (immigration status crosswalk, not imported), MEDIL I 26-24 title (termination of categorical parole programs)]
    affects: [MCD-CA-IMMIGRANT-2026]
    status: open

conflicts:
  - id: MCD-CA-CONFLICT-01
    topic: Whether property exactly at $130,000 qualifies
    claims:
      - source: ca-dhcs-acwdl-25-20
        says: CEWs must grant eligibility if attested or electronically found assets are at, or under $130,000 for one person and $65,000 for each additional person.
      - source: ca-dhcs-acwdl-25-14
        says: Denial notice when countable property "is above the Medi-Cal program limit".
      - source: ca-hca-asset-limits-practice-tip-2026
        says: To get or keep coverage a single person must have countable assets less than $130,000.
    handling: DHCS (ACWDL 25-20 and the 25-14 notices) and the county handbook ("equal to or below") agree that $130,000 qualifies; the advocacy summary is secondary and the archive follows DHCS. Tests pin the at-limit case.
    affects: [MCD-CA-ASSET-LIMIT]
    status: resolved
  - id: MCD-CA-CONFLICT-02
    topic: Header of the reinstated property limit column
    claims:
      - source: ca-scc-chart-property-limits
        says: Column headed "Propert Limit Reinstatement January 1, 2024" with $130,000 for one person.
      - source: ca-dhcs-acwdl-25-14
        says: The asset test is reinstated no sooner than January 1, 2026; the second phase eliminated limits January 1, 2024.
    handling: Treated as a typo in the county chart header; the archive uses January 1, 2026 per DHCS.
    affects: [ca.medi_cal.non_magi_asset_limit]
    status: resolved
  - id: MCD-CA-CONFLICT-03
    topic: Scope of coverage for pregnant people between 138% and 213% FPL
    claims:
      - source: ca-dhcs-fpl-2026-programs
        says: "213% FPL = Full-Scope Coverage for ACA Pregnant Persons."
      - source: ca-scc-chart-fpl-2026
        says: 138% is full-scope coverage for ACA pregnant women; above 138% to 213% FPL is pregnancy-related Medi-Cal.
    handling: The archive follows DHCS (full scope up to 213%). The evaluator does not distinguish full from pregnancy-related scope for pregnant people, so no test outcome depends on it.
    affects: [MCD-CA-MAGI-PREGNANT]
    status: open
  - id: MCD-CA-CONFLICT-04
    topic: Date dental ends for adults without satisfactory immigration status who kept coverage
    claims:
      - source: ca-dhcs-medil-i26-18
        says: The elimination of non-emergency dental for members 19 and older no longer eligible for federally funded full scope has been delayed to July 1, 2027 (SB 164, 2026 budget).
      - source: ca-dhcs-acwdl-25-13
        says: Limited scope Medi-Cal will cover the same services as full scope with the exception of dental care services effective July 1, 2026.
      - source: ca-scc-mc-update-2025-10-expansion-freeze
        says: Dental coverage ends July 1, 2026 except emergencies.
    handling: The later DHCS letter (MEDIL I 26-18, July 7, 2026) governs; the archive uses July 1, 2027. The first pass used July 1, 2026 from the county page.
    affects: [MCD-CA-EXPANSION-GRACE]
    status: resolved

claims_checked:
  - claim: California reinstated an asset limit for Medi-Cal, reported as $130,000 for one person.
    verdict: verified
    detail: >-
      DHCS ACWDL 25-14: effective January 1, 2026, for Non-MAGI programs
      (aged, blind, disabled, Medically Needy, long-term care and the Medicare
      Savings Programs), $130,000 for one person plus $65,000 for each
      additional household member, up to 10 people ($195,000 for a couple);
      Pickle, DAC and Disabled Widow(er) follow on January 1, 2027 (ACWDL
      26-16). MAGI Medi-Cal has no asset test. Limits were eliminated January
      1, 2024 through December 31, 2025. At exactly the limit the person
      qualifies ("at, or under", ACWDL 25-20).
    sources:
      - {source: ca-dhcs-acwdl-25-14, locator: "Policy Change; Household Asset Limits"}
      - {source: ca-dhcs-acwdl-25-20, locator: "at, or under $130,000"}
      - {source: ca-dhcs-acwdl-26-16, locator: "Policy Change"}
  - claim: California's Medi-Cal application forms include the MC 210, MC 210 RV, MC 216 and SAWS 2 Plus.
    verdict: corrected
    detail: >-
      The application is the Single Streamlined Application (updated 2026,
      2013 version still accepted) or the SAWS 2 PLUS; MC 216 is the MAGI
      renewal form, MC 210 RV the Non-MAGI renewal form and MC 217 the
      pre-populated renewal form; MC 210A is the retroactive supplement. The
      county handbook calls the old MC 210 application outdated but
      acceptable (county-only).
