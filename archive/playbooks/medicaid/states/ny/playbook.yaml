links:
  - id: MCD-NY-LINK-MSP
    playbook: msp
    rules: [MCD-NY-SSI-RELATED-INCOME]
    relation: >-
      New York's QMB income level equals the SSI-related Medicaid income level
      ($1,836 / $2,489 in 2026), so a QMB-eligible person is usually also
      Medicaid-eligible without a spenddown; a person in the QI range must
      choose between QI and Medicaid with a spenddown.
    test: MCD-X-01
    confidence: confirmed
    sources: [{source: ny-gis-26-ma-05-att1, locator: "SSI-Related Medicaid Income Level 1,836 2,489; QMB 138% FPL 1,836 2,489"}]
  - id: MCD-NY-LINK-SNAP
    playbook: snap
    relation: The LDSS-2921 combined application covers public assistance, SNAP and Medicaid in New York; whether it is still used for Medicaid was not established (MCD-NY-OQ-01).
    test: MCD-X-05
    confidence: secondary
    sources: [{source: ny-gis-07-ma-027, locator: "The long application, LDSS-2921"}]

open_questions:
  - id: MCD-NY-OQ-01
    priority: low
    question: Is the LDSS-2921 still accepted or used for Medicaid-only applications, or only for combined public assistance/SNAP/Medicaid requests?
    why_it_matters: The agent should name the right form for a member who also wants SNAP.
    checked: [GIS 07 MA/027, DOH How to Apply page, DOH-4220]
    affects: [MCD-NY-PROC-LDSS-2921]
    status: open
  - id: MCD-NY-OQ-02
    priority: medium
    question: What is the name/format of New York's Medicaid approval notice (LDSS Notice of Decision; NY State of Health eligibility notice), and does it state the spenddown amount?
    why_it_matters: Outcome proof the member can show.
    checked: [DOH How to Apply page, DOH-4220, NY State of Health H.R.1 page]
    affects: [MCD-NY-NOTICE, MCD-NY-PROOF-NOTICE]
    status: open
  - id: MCD-NY-OQ-03
    priority: high
    question: For 2027, will New York's 2027 SSI-related income and resource levels again take effect January 1 (the archive uses the 2026 levels for 2027 dates until a GIS publishes them)?
    why_it_matters: January-February 2027 cases near the limit.
    checked: [GIS 26 MA/03, GIS 26 MA/05]
    affects: [ny.medicaid.ssi_related_income_limit_monthly, ny.medicaid.ssi_related_resource_limit]
    status: open
  - id: MCD-NY-OQ-04
    priority: medium
    question: Which coverage do undocumented children and young adults under 21 get in New York (Medicaid, Child Health Plus), and is any noncitizen category before October 1, 2026 (e.g. parolees) treated differently from the federal list?
    why_it_matters: The evaluator returns undetermined for these cases.
    checked: [GIS 26 MA/14, DOH How to Apply page, NY State of Health H.R.1 page]
    affects: [MCD-NY-UNDOCUMENTED, MCD-NY-IMMIGRANT-2026]
    status: open
  - id: MCD-NY-OQ-05
    priority: low
    question: Does New York's 12-month postpartum coverage extension apply on top of the 60-day statement in the 2026 chart?
    why_it_matters: Postpartum members.
    checked: [GIS 26 MA/05 attachment]
    affects: [MCD-NY-MAGI-PREGNANT]
    status: open
  - id: MCD-NY-OQ-06
    priority: medium
    question: Which current DOH directive governs using a pooled trust to meet a monthly income spenddown (the MRG pages retrieved cover the asset exemption only)?
    why_it_matters: Pooled trusts are the main way disabled New Yorkers over the income level keep Medicaid without paying the spenddown.
    checked: [MRG Resources (TRUST FUNDS), MRG Income (EXCESS), GIS 26 MA/14]
    affects: [MCD-NY-POOLED-TRUST]
    status: open

conflicts:
  - id: MCD-NY-CONFLICT-01
    topic: Who gets 1 versus 2 retroactive months from 2027
    claims:
      - source: pl-119-21-medicaid
        locator: "sec. 71112, new 1902(a)(34)(A)"
        says: One month only for individuals enrolled in the adult expansion group (1902(a)(10)(A)(i)(VIII)); two months for everyone else.
      - source: nysoh-stay-covered
        locator: "Help with Past Medical Bills"
        says: "If you are an adult aged 19-64: Medicaid can pay for 1 month of past medical bills. All others: 2 months."
    handling: >-
      The archive follows the statute (enrollment group), so a New York parent
      aged 19-64 covered as a parent/caretaker gets 2 months. A reviewer
      should confirm New York's implementation; the NYSoH page is consumer
      shorthand.
    affects: [MCD-NY-RETRO, MCD-FED-RETRO-2027]
    status: open

claims_checked:
  - claim: New York's asset limit for age/disability-based and long-term care Medicaid is about $33,038 for one person in 2026.
    verdict: verified
    detail: >-
      The 2026 chart (GIS 26 MA/05 attachment) gives an SSI-related resource
      level of $33,038 for one and $44,796 for a couple, and $33,038 for an
      institutionalized spouse. It is not a hard cap in community Medicaid:
      resources over the level can be spent down on medical bills
      (MCD-NY-EXCESS-RESOURCES). The 2025 figure was $32,396. Long-term care
      details are in ltc_medicaid.
    sources:
      - {source: ny-gis-26-ma-05-att1, locator: "SSI-Related Medicaid ... Resource Level 33,038 44,796"}
  - claim: New York's non-MAGI SSI-related income level is $1,836 (single) / $2,489 (couple) a month in 2026.
    verdict: verified
    detail: 138% FPL, compared with countable income after the $20 disregard (so gross unearned income up to $1,856 single qualifies).
    sources: [{source: ny-gis-26-ma-05-att1, locator: "SSI-Related Medicaid Income Level 1,836 2,489"}]
