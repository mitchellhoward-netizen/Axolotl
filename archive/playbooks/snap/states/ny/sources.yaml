# New York sources for SNAP. otda.ny.gov (OTDA directives, GIS messages, the
# SNAP Source Book) answered every scripted, research-tool and headless-browser
# request on 2026-10-07 with a bot challenge, a reset connection or HTTP 503, so
# no OTDA-hosted document could be snapshotted. A second pass the same day
# (Playwright headful under Xvfb with a desktop user agent and network-idle
# waits; WebFetch) still got only the F5 JavaScript challenge or HTTP 503, and
# the Internet Archive (web.archive.org) was unreachable from this environment
# (connection reset; WebFetch refused; archive.org's availability API reports no
# capture of 02 ADM-07). The FFY 2026 standards GIS is taken from a verbatim copy
# posted by a county social services district; the FFY 2027 figures come from a
# county DSS page (income limits) and two advocacy sheets (utility allowances).
# OTDA regulations (18 NYCRR Part 387) are cited from Cornell LII's copy
# (secondary: the official NYCRR and NYS Register hosts refused requests).
