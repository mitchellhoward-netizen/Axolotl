- id: SNAP-X-01
  title: 'MSP crossing (models MSP-X-03): NY retiree paying the $202.90 Part B premium'
  as_of: '2026-03-01'
  tags:
  - single
  - cross_playbook
  - other_benefits
  household:
    state: ny
    members:
    - id: a
      age: 70
      relationship: self
      medicare_part_a: true
      medicare_part_b: true
    incomes:
    - kind: social_security
      monthly: 1400
      owner: a
    assets: []
    county: Albany
    expenses:
      rent: 400
      medical: 202.9
    facts:
      utilities: *id002
      part_b_premium_in_medical: true
  expect:
    status: eligible
    tier: regular
    rules_include:
    - SNAP-FED-MEDICAL
    - SNAP-FED-MSP-PART-B
    amounts:
      benefit_monthly: 220.0
      net_income_monthly: 257.65
      utility_allowance_monthly: 877.0
      medical_deduction_monthly: 167.9
    links_include:
    - msp:part_b_in_medical_deduction
  also:
  - program: msp
    expect:
      status: eligible
      tier: QMB
  crosscheck:
    policyengine: true
  note: 'Models the MSP <-> SNAP crossing the MSP playbook reserves as MSP-X-03 (link MSP-NY-LINK-SNAP / SNAP-NY-LINK-MSP).
    With the Part B premium paid by the member the SNAP medical deduction is $167.90 and SNAP is $220. SNAP-X-01B is the same
    household after QMB pays the premium: SNAP $145, a $75 drop (net income rises by 1.5 x $167.90 because the excess shelter
    deduction also shrinks), against $202.90 a month gained from the MSP. When the drop takes effect (next recertification
    under 02 ADM-07, or earlier under 7 CFR 273.12(c)) is SNAP-NY-OQ-05.'
