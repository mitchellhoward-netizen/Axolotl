open_questions:
  - id: MSP-FED-OQ-01
    priority: medium
    question: From what date must states use the new year's poverty-guideline-based MSP limits (January 1, the publication date, or later)?
    why_it_matters: Determines which limit applies to January-March applications. New York says January 1 (GIS 26 MA/05); other states may differ.
    checked: [42 U.S.C. 1396d(p)(2), SSA POMS HI 00815.023, Medicare.gov MSP page]
    affects: [federal.msp.qmb_income_limit_monthly, federal.msp.slmb_income_limit_monthly, federal.msp.qi_income_limit_monthly]
    status: open
  - id: MSP-FED-OQ-02
    priority: medium
    question: >-
      Does the 2027 shortening of Medicaid retroactive coverage (Public Law
      119-21) apply to SLMB and QI retroactive months, and if so, to one or
      two months?
    why_it_matters: Changes how much back premium a person can recover when they apply late.
    checked: [42 U.S.C. 1396a(a)(34) (2023 edition, before the change), secondary summaries of Public Law 119-21 sec. 71112]
    affects: [MSP-FED-RETRO-2027, MSP-FED-RETRO-SLMB-QI]
    status: open
  - id: MSP-FED-OQ-03
    priority: high
    question: How is a married couple budgeted when only one spouse has Medicare (couple limit with both incomes, or individual limit with spousal deeming)?
    why_it_matters: Couples with one Medicare spouse are common among retirees.
    checked: [Medicare.gov MSP page, SSA POMS HI 00815.023]
    affects: [MSP-FED-COUPLE-INCOME]
    status: open
  - id: MSP-FED-OQ-04
    priority: high
    question: >-
      Which primary source documents the SSA notice a person receives when a
      state starts paying (buy-in of) their Part B premium, and how many months
      it usually takes before the deduction stops and the refund of
      already-deducted premiums arrives?
    why_it_matters: This is the outcome proof the institution pays on; the agent needs to tell the member what to look for and when.
    checked: [Medicare.gov MSP page, SSA POMS HI 00815.024, HI 00815.001, HI 00815.018, HI 00815.039, HI 00815.060, HI 01001.205, CMS Manual for State Payment of Medicare Premiums ch. 1 (Rev. 7) and ch. 2 (Rev. 4), "42 CFR 406.26, 407.40, 407.42, 407.47"]
    affects: [MSP-FED-PROOF-SSA-DEDUCTION, MSP-FED-PROOF-BUYIN-NOTICE, MSP-FED-PROOF-PREMIUM-REFUND]
    status: answered
    answer: >-
      SSA POMS HI 00815.039 A: SSA sends a notice of the buy-in effective
      date, the Part B deduction stops (higher monthly payment) or direct
      billing ends, and SSA refunds premiums deducted or paid for any month on
      buy-in; HI 01001.205 says a retroactively processed buy-in is refunded
      in a separate check; CMS buy-in manual ch. 1, 1.5 adds that late
      penalties are refunded too and the refund is not income. Buy-in starts
      with the MSP effective month (HI 00815.018; 42 CFR 407.47(c)). The
      number of months until the deduction stops is not in any federal
      primary source: split out as MSP-FED-OQ-06.
  - id: MSP-FED-OQ-06
    priority: high
    question: >-
      How many months after an MSP approval does SSA typically stop the Part
      B deduction and pay the refund (is there a federal processing standard
      for state accretions or for SSA's refund)?
    why_it_matters: The fund pays on the deduction stopping; the agent must tell the member when to expect it and when to escalate.
    checked: [CMS Manual for State Payment of Medicare Premiums ch. 1 and ch. 2 (daily exchange, COM schedule, billing period rules; no beneficiary-facing timeline), SSA POMS HI 00815.039, HI 00815.060, HI 00815.063, HI 01001.205, "42 CFR 407.40 and 407.47", ssa.gov benefit-letter pages (HTTP 403)]
    affects: [MSP-FED-BUYIN-DEDUCTION-TIMING, MSP-FED-BUYIN-DAILY-EXCHANGE, MSP-FED-TIME-BUYIN, MSP-FED-PROOF-SSA-DEDUCTION, MSP-FED-PROOF-BUYIN-NOTICE]
    status: open

  - id: MSP-FED-OQ-05
    priority: low
    question: Are SSI and state supplementary payments excluded from countable income for the Medicare Savings Programs (as needs-based assistance), in every state?
    why_it_matters: The evaluator excludes them; an SSI recipient's MSP result depends on it (though most SSI recipients get Medicaid and QMB anyway).
    checked: [42 U.S.C. 1382a(b) (SSI exclusions), SSA POMS HI 00815.023]
    affects: [MSP-FED-INCOME-SSI-METHOD]
    status: open

conflicts:
  - id: MSP-FED-CONFLICT-01
    topic: Which month Part B buy-in starts for SLMB and QI enrollees
    claims:
      - {source: cfr-42-407, locator: "407.47(c)-(d)", says: "407.47(c) gives the first-month start only to QMBs; 407.47(d) covers individuals who 'are not QMBs' (and not cash-assistance) and starts their buy-in the second month after they meet SMI and Medicaid eligibility."}
      - {source: ssa-poms-hi-00815-018, locator: "D. Summary of Buy-in Start Dates (SLMB and QI rows, citing 42 CFR 407.47(c))", says: "SLMB and QI: Part B buy-in starts the first day of the month an individual qualifies for Medicare and is a member of the coverage group."}
      - {source: cms-spmp-ch1, locator: "1.13.1; Appendix 1.C", says: "For the three MSPs, Part B buy-in begins the first month the individual meets both buy-in group and Part B eligibility (42 CFR 407.47(b) and (c))."}
    handling: >-
      The archive follows CMS's manual and SSA's POMS (the agencies that run
      buy-in): SLMB and QI buy-in starts with the MSP effective month
      (MSP-FED-BUYIN-START). Either way the person is refunded premiums for
      every buy-in month, so the reading changes at most one month of
      refund.
    affects: [MSP-FED-BUYIN-START]
    status: open

claims_checked:
  - claim: The 2026 federal poverty guideline for one person is $15,960 a year.
    verdict: verified
    detail: Federal Register Vol. 91 No. 10 (Jan 15, 2026), 48 contiguous states and DC; effective January 13, 2026 unless a program sets another date.
    sources: [{source: fr-2026-hhs-poverty-guidelines, locator: "2026 Poverty Guidelines table"}]
  - claim: The 2026 standard Part B premium is $202.90 a month.
    verdict: verified
    detail: CMS 2026 Parts A & B fact sheet (Nov 14, 2025).
    sources: [{source: cms-2026-part-a-b-premiums, locator: "Medicare Part B Premium and Deductible"}]
  - claim: The QI tier of the Medicare Savings Program is federally funded within capped state allotments and cannot be combined with full Medicaid.
    verdict: verified
    detail: 42 U.S.C. 1396u-3 (100% federal share within the state's allocation, 0% above) and 1396a(a)(10)(E)(iv) ("not otherwise eligible for medical assistance under the State plan").
    sources:
      - {source: usc-42-1396u-3, locator: "(a)"}
      - {source: usc-42-1396a, locator: "(a)(10)(E)(iv)"}
