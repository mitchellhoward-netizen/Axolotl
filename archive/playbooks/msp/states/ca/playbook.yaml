      - {source: ca-dhcs-acwdl-25-27, locator: "MSP 2026 Property Limits"}

open_questions:
  - id: MSP-CA-OQ-01
    priority: medium
    question: Can a California member with share-of-cost (medically needy) Medi-Cal hold QI, or does any Medi-Cal enrollment bar QI?
    why_it_matters: Retirees just over the ABD FPL limit often have share-of-cost Medi-Cal; QI may be their only Part B premium help.
    checked: [DHCS MSP page ("cannot also receive Medi-Cal"), ACWDL 23-05, MC 14A, MEPM 5L]
    affects: [MSP-CA-QI-NOT-MEDI-CAL]
    status: open
  - id: MSP-CA-OQ-02
    priority: high
    question: >-
      Can a Californian 65+ who has Part B but no Part A (not enough work
      quarters) get QMB with the state buying Part A, without first being on
      full-scope Medi-Cal or enrolling in conditional Part A at SSA?
    why_it_matters: Part A buy-in states can enroll QMBs in Part A at any time; telling the member the wrong route can cost months of coverage.
    checked: [MEDIL I 25-01, DHCS Buy-In page, Part A buy-in flyer, ACWDL 26-12; ACWDL 24-20 (link returned "page not found")]
    affects: [MSP-CA-PART-A-BUY-IN]
    status: open
  - id: MSP-CA-OQ-03
    priority: medium
    question: How does California set the MSP family size (MFBU) when children or other dependants live in the home, and what did the 2025 letter on "aligning the definition of family size for MSPs" (ACWDL 25-07, now marked obsolete) change?
    why_it_matters: The limit for a larger family is higher (MC 14A says amounts "may be higher" with a child at home); grandparents raising grandchildren could be wrongly turned away.
    checked: [MC 14A footnote, MEPM 5L, DHCS 2025 ACWDL index (25-07 listed as obsolete, no link)]
    affects: [MSP-CA-COUPLE]
    status: open
  - id: MSP-CA-OQ-04
    priority: medium
    question: What is the current "Standard SSI Allocation" amount California uses when a QMB/SLMB/QI applicant lives with a spouse who is not applying?
    why_it_matters: Couples where one spouse is younger and without Medicare can qualify under SSI methodology when the couple budget fails.
    checked: [MEPM Article 5L (amount "provided to counties annually"), MC 176 QMB/SLMB/QI worksheet]
    affects: [ca.msp.standard_ssi_allocation_monthly, MSP-CA-INELIGIBLE-SPOUSE]
    status: open
  - id: MSP-CA-OQ-05
    priority: medium
    question: Which assets count toward California's 2026 MSP property limit (home, one vehicle, retirement accounts, burial funds) under the reinstated Article 9 rules?
    why_it_matters: The evaluator excludes the home, one vehicle and burial spaces as SSI does; the DHCS MSP page lists "vehicles" among assets.
    checked: [ACWDL 25-14, ACWDL 25-27, DHCS MSP page]
    affects: [ca.msp.asset_limit, MSP-CA-ASSET-LIMIT]
    status: open
  - id: MSP-CA-OQ-06
    priority: medium
    question: Does California QMB start the month after the application or the month after the county approves the case?
    why_it_matters: Tells the member when Medicare cost-sharing protection begins.
    checked: [MEPM 5L (1997), ACWDL 23-05, ACWDL 26-12 NOA snippet]
    affects: [MSP-CA-QMB-EFFECTIVE]
    status: open
  - id: MSP-CA-OQ-07
    priority: low
    question: Is California's QDWI 200% FPL standard compared to income before or after the $65-plus-half earned income deduction?
    why_it_matters: QDWI applicants are by definition working; the answer changes the effective limit by half of earnings.
    checked: [DHCS MSP page, ACWDL 26-01 Enclosure 3, MEPM 5L (QDWI is Article 5I, not retrieved)]
    affects: [ca.msp.qdwi_income_limit_monthly, MSP-CA-QDWI]
    status: open
  - id: MSP-CA-OQ-08
    priority: medium
    question: What is the county's deadline to decide an MSP application in California (45 days as for other non-disability Medi-Cal?), and is an interview required?
    why_it_matters: The agent should tell the member when to expect the Notice of Action and when to follow up.
    checked: [DHCS MSP page, MC 14A, ACWDL 25-14]
    affects: [MSP-CA-TIME-DECISION]
    status: open

conflicts:
  - id: MSP-CA-CONFLICT-01
    topic: When the 2026 COLA starts counting / new FPL takes effect for MSP cases with Social Security income
    claims:
      - {source: ca-dhcs-acwdl-25-26, locator: "Processing the 2026 SSA COLA", says: "COLA disregarded for ABD FPL and MSPs until the 2026 FPL rates take effect on April 1, 2026."}
      - {source: ca-dhcs-acwdl-26-01, locator: "page 1", says: "For MSP applicants or recipients receiving Title II RSDI income, the effective date for the new FPLs is March 1, 2026."}
      - {source: ca-dhcs-mc-14a, locator: "footnote", says: "These amounts are expected to increase each year in April; a January COLA will not be counted until April."}
    handling: >-
      The evaluator follows ACWDL 26-01 (later and MSP-specific): RSDI cases
      use the 2025 standards with the COLA excluded through February and the
      2026 standards with the COLA counted from March 1. A March 2026 case
      near a limit could come out differently under the April reading.
    affects: [MSP-CA-FPL-EFFECTIVE, MSP-CA-COLA]
    status: open
  - id: MSP-CA-CONFLICT-02
    topic: Whether income exactly at 120% / 135% FPL qualifies for SLMB / QI
    claims:
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4", says: "SLMB-120% FPL or below; QI-135% FPL or below."}
      - {source: ca-dhcs-fpl-2026-programs, locator: "Notes", says: "SLMB and QI-1 are marked '<' (eligible if income is less than the limit)."}
      - {source: ca-dhcs-mc-14a, locator: "page 1", says: "SLMB: below 120%; QI: below 135%."}
    handling: >-
      The evaluator uses "less than" for SLMB and QI, following the 2026
      enclosure, the application form and federal law (1902(a)(10)(E)(iii)-(iv)).
      Test MSP-CA-T04 pins countable income of exactly $1,596 as QI, not SLMB.
    affects: [MSP-CA-SLMB-INCOME, MSP-CA-QI-INCOME]
    status: open
  - id: MSP-CA-CONFLICT-03
    topic: DHCS page's headline MSP income ceiling
    claims:
      - {source: ca-dhcs-msp-page, locator: "intro", says: "Californians with an annual income of less than $22,025 for an individual or $29,864 for a couple are eligible for a Medicare Savings Program (that is 138% FPL)."}
      - {source: ca-dhcs-msp-page, locator: "table", says: "QI (the highest-income MSP tier) monthly limit $1,796 / annual $21,546 (135% FPL)."}
      - {source: ca-dhcs-fpl-2026-programs, locator: "135% FPL", says: "QI-1 is < 135% FPL."}
    handling: >-
      The evaluator uses the 135% QI standard. The $22,025 headline matches
      138% FPL (the ABD/Adult Medi-Cal level), not any MSP standard; the
      agent should not quote it as the MSP limit.
    affects: [MSP-CA-QI-INCOME]
    status: open
  - id: MSP-CA-CONFLICT-04
    topic: Asset test start date wording
    claims:
      - {source: ca-dhcs-acwdl-25-14, locator: "Application", says: "Applicants with an application date after January 1, 2026 must report assets."}
      - {source: ca-dhcs-acwdl-25-14, locator: "Example #1", says: "The asset test applies ... as the submission date falls on or after January 1, 2026."}
    handling: The archive applies the test to applications dated on or after January 1, 2026 (a state holiday, so few applications are affected).
    affects: [MSP-CA-ASSET-TRANSITION]
    status: open
  - id: MSP-CA-CONFLICT-05
    topic: QMB effective date
    claims:
      - {source: usc-42-1396a, locator: "(e)(8)", says: "QMB applies to services after the end of the month in which the QMB determination first occurs."}
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4", says: "QMB starts the month after the county has processed the case."}
      - {source: ca-dhcs-acwdl-26-12, locator: "QMB Approval snippet", says: "QMB eligibility starts the month after you apply."}
    handling: Rule MSP-CA-QMB-EFFECTIVE is marked unresolved; the agent should say "the month after the county approves it, or possibly the month after you apply" and point to the Notice of Action's start date.
    affects: [MSP-CA-QMB-EFFECTIVE]
    status: open

claims_checked:
  - claim: California reinstated an asset limit for Medi-Cal, reported as $130,000 for one person.
    verdict: verified
    detail: >-
      Correct, and it applies to the Medicare Savings Programs: from January
      1, 2026 the limit for QMB, SLMB, QI and QDWI (and the other non-MAGI
      programs) is $130,000 for one person, $195,000 for two, plus $65,000
      for each additional person up to ten (ACWDL 25-14, ACWDL 25-27,
      AB 116). There was no MSP asset limit from January 1, 2024 to December
      31, 2025. New applicants are tested from January 1, 2026; existing
      members at their first renewal on or after that date. The Pickle,
      Disabled Adult Child and Disabled Widow(er) programs stay exempt until
      January 1, 2027 (ACWDL 26-16). The limit is not the federal MSP limit
      ($9,950 / $14,910): California has CMS approval to use higher limits.
    sources:
      - {source: ca-dhcs-acwdl-25-14, locator: "Policy Change; Impacted Populations; Household Asset Limits table"}
      - {source: ca-dhcs-acwdl-25-27, locator: "MSP 2026 Property Limits"}
      - {source: ca-dhcs-acwdl-26-16, locator: "Background"}
  - claim: California applies additional income disregards for aged/disabled Medi-Cal programs that also apply to the MSPs.
    verdict: refuted
    detail: >-
      No DHCS source applies the ABD FPL program's extra disregards or its
      Part B premium disregard to the MSPs. MSP income is counted with the
      $20 any income deduction and $65-plus-half (MEPM 5L, MC 14A), premiums
      are not deductible (ACWDL 23-05), and the published MSP limits are the
      plain 100/120/135% FPL figures.
    sources:
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4"}
      - {source: ca-dhcs-acwdl-25-26, locator: "Medicare Part B Disregard Reminder (ABD FPL only)"}
  - claim: California became a Medicare Part A buy-in state.
    verdict: verified
    detail: Effective January 1, 2025 (SB 311, WIC 14005.11); DHCS pays Part A premiums for QMB members with Part B and auto-enrolled SSI/SSP recipients into QMB.
    sources: [{source: ca-dhcs-medil-i25-01, locator: "Background"}]
  - claim: California switches to the new year's poverty levels on April 1.
    verdict: partly_verified
    detail: >-
      April 1 is the date for the ABD FPL and 250% Working Disabled programs.
      For the MSPs it is January 1 (no RSDI income) or March 1 (RSDI income),
      per ACWDL 26-01, though ACWDL 25-26 and the MC 14A still say April for
      the COLA (MSP-CA-CONFLICT-01).
    sources: [{source: ca-dhcs-acwdl-26-01, locator: "page 1-2"}]
