life_events:
  - id: MSP-CA-LE-RETIRE
    code: retirement
    event: Retirement or a drop in income
    why: Countable income under $1,796 single / $2,436 couple (2026) qualifies for QI or better, subject to the $130,000 / $195,000 property limit.
    check_rules: [MSP-CA-QMB-INCOME, MSP-CA-SLMB-INCOME, MSP-CA-QI-INCOME, MSP-CA-ASSET-LIMIT]
    confidence: confirmed
    sources: [{source: ca-dhcs-msp-page, locator: "Medicare Savings Programs and What Each Provides"}]
  - id: MSP-CA-LE-RENEWAL-2026
    code: renewal_due
    event: First Medi-Cal/MSP renewal on or after January 1, 2026
    why: Members who enrolled when there was no asset test must now report assets; over $130,000 / $195,000 ends the MSP, and missing information can be cured within 90 days.
    check_rules: [MSP-CA-ASSET-TRANSITION, MSP-CA-ASSET-CURE-PERIOD]
    confidence: confirmed
    sources: [{source: ca-dhcs-acwdl-25-14, locator: "Impacted Populations; Annual Renewal"}]
  - id: MSP-CA-LE-ASSETS
    code: asset_change
    event: Inheritance, sale of property or large savings change
    why: From 2026 property above $130,000 (single) / $195,000 (couple) ends MSP eligibility; changes must be reported within 10 days.
    check_rules: [MSP-CA-ASSET-LIMIT, MSP-CA-REPORT-CHANGES]
    confidence: confirmed
    sources: [{source: ca-dhcs-acwdl-25-14, locator: "Change in Circumstance"}]
  - id: MSP-CA-LE-JANUARY
    code: cola_january
    event: January COLA and new poverty levels
    why: RSDI recipients stay on the prior year's standards (COLA not counted) until March 1; others switch January 1.
    check_rules: [MSP-CA-FPL-EFFECTIVE, MSP-CA-COLA]
    confidence: confirmed
    sources: [{source: ca-dhcs-acwdl-26-01, locator: "page 1"}]
  - id: MSP-CA-LE-MEDI-CAL
    code: medicaid_change
    event: Starting or losing Medi-Cal
    why: QI cannot be held with Medi-Cal; QMB members with Part B on Medi-Cal get the Part A buy-in.
    check_rules: [MSP-CA-QI-NOT-MEDI-CAL, MSP-CA-PART-A-BUY-IN]
    confidence: confirmed
    sources: [{source: ca-dhcs-msp-page, locator: "QI ... cannot also receive Medi-Cal"}]

