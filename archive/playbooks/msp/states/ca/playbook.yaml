links:
  - id: MSP-CA-LINK-MEDICAID
    playbook: medicaid
    rules: [MSP-CA-QI-NOT-MEDI-CAL, MSP-CA-PART-A-BUY-IN, MSP-CA-SSI-AUTO-QMB]
    relation: >-
      In California QI cannot be held with Medi-Cal; QMB can, and QMB members
      on full-scope Medi-Cal with Part B get the state Part A buy-in. The same
      reinstated $130,000 / $195,000 property limit applies to the Medi-Cal
      ABD programs and the MSPs from 2026.
    test: MSP-CA-T16
    confidence: confirmed
    sources:
      - {source: ca-dhcs-msp-page, locator: "QI ... cannot also receive Medi-Cal"}
      - {source: ca-dhcs-acwdl-25-14, locator: "programs chart"}
  - id: MSP-CA-LINK-EXTRA-HELP
    playbook: msp
    rules: [MSP-FED-EXTRA-HELP-DEEMED, MSP-CA-ASSET-LIMIT]
    relation: >-
      QMB, SLMB or QI in California deems Extra Help; because California's
      MSP property limit ($130,000) is far above the Extra Help limit
      ($16,590), MSP enrollment gives Extra Help to people who would fail
      Extra Help's own resource test.
