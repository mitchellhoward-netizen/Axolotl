schema_version: 2
program: msp
scope: ca
title: Medicare Savings Program — California (Medi-Cal)
last_researched: 2026-10-07

summary:
  plain_language: >-
    In California the Medicare Savings Programs are part of Medi-Cal and are
    run by the county social services offices. They use the four federal
    programs: QMB (countable income up to $1,330 a month single or $1,804 for
    a couple in 2026, which is gross income up to about $1,350 / $1,824 after
    the $20 deduction) pays Medicare premiums, deductibles and copays; SLMB
    (below $1,596 / $2,165 countable) and QI (below $1,796 / $2,436) pay the
    Part B premium ($202.90 a month in 2026). From January 1, 2026 California
    again has an asset limit for these programs, $130,000 for one person and
    $195,000 for a couple, after having no asset limit in 2024 and 2025.
    Since January 2025 California also pays the Part A premium for QMB
    members who have Part B (the Part A buy-in). Enrolling in QMB, SLMB or QI
    brings Extra Help with Part D drug costs.
  administered_by: >-
    California Department of Health Care Services (DHCS, Medi-Cal Eligibility
    Division) sets policy through All County Welfare Directors Letters
    (ACWDLs) and MEDILs; the 58 county social services agencies take
    applications and decide eligibility (CalSAWS / BenefitsCal).
  funded_by: >-
    QMB, SLMB and QDWI are Medi-Cal (federal/state Medicaid match). QI is
    federally funded within California's yearly allotment (federal rule).
  local_names:
    - {name: Medi-Cal, meaning: California's Medicaid program; the MSPs are Medi-Cal programs}
    - {name: Medicare Premium Payment Program / Buy-In, meaning: DHCS's name for the state paying Medicare premiums}
    - {name: QI-1, meaning: "California's name for QI in DHCS charts"}
    - {name: "Aid codes 80 / 8C / 8D / 8A", meaning: "QMB / SLMB / QI / QDWI aid codes in ACWDL 25-14"}
    - {name: MC 14A, meaning: The short QMB/SLMB/QI application form}
    - {name: BenefitsCal, meaning: California's online application portal for Medi-Cal and the MSPs}
  confidence: confirmed
  sources:
    - {source: ca-dhcs-msp-page, locator: "whole page"}
    - {source: ca-dhcs-acwdl-25-27, locator: "MSP 2026 Property Limits"}
    - {source: ca-dhcs-medil-i25-01, locator: "Background"}

rules:
  - id: MSP-CA-TIERS
    statement: >-
      California offers all four federal Medicare Savings Programs — QMB,
      SLMB, QI (called QI-1 in DHCS charts) and QDWI — through Medi-Cal, at
      the federal-minimum income percentages of 100%, 120%, 135% and 200% of
      the federal poverty level.
    kind: definition
    effective_from: 2023-01-01
    implemented_in: playbooks/msp/states/ca/rules.py:evaluate
    confidence: confirmed
    sources:
      - {source: ca-dhcs-msp-page, locator: "Medicare Savings Programs and What Each Provides (table)"}
      - {source: ca-dhcs-fpl-2026-programs, locator: "100% FPL = QMB; 120% FPL = < SLMB; 135% FPL = < QI-1; 200% FPL = Qualified Working Disabled Individuals"}
  - id: MSP-CA-QMB-INCOME
    statement: >-
      In California in 2026, a person with Medicare Part A qualifies for QMB
      if net countable income (after the $20 any income deduction and earned
      income deductions) is equal to or less than $1,330 a month for one
      person or $1,804 for a couple, so gross Social Security of up to $1,350
      (single) or $1,824 (couple) qualifies.
    kind: eligibility
    applies_to: [QMB]
    effective_from: 2026-01-01
    parameters: [ca.msp.qmb_income_limit_monthly, ca.msp.income_disregard_monthly]
    overrides: [MSP-FED-QMB-INCOME-FLOOR]
    implemented_in: playbooks/msp/states/ca/rules.py:_tier
    confidence: confirmed
    note: >-
      DHCS rounds monthly FPL figures up to the next dollar, so the couple
      standard is $1,804 where the federal table (100% FPL + $20 = $1,824
      gross) implies $1,803.33 countable; a couple with countable income of
      exactly $1,804 is QMB in California.
    sources:
      - {source: ca-dhcs-fpl-2026-monthly, locator: "100% column; MONTHLY FPL VALUES (Rounded up to next higher dollar)"}
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4", quote: "compare net countable income to the following Federal Poverty Level (FPL) amounts: QMB-100% FPL or below for the family size."}
      - {source: ca-dhcs-msp-page, locator: "Qualified Medicare Beneficiary: Monthly – $1,330 / $1,804"}
  - id: MSP-CA-SLMB-INCOME
    statement: >-
      In California in 2026, a person with Medicare Part A whose net
      countable income is above the QMB standard and less than $1,596 a month
      (one person) or $2,165 (couple) qualifies for SLMB, which pays the
      Part B premium; gross Social Security of $1,351 to $1,615 (single)
      qualifies.
    kind: eligibility
    applies_to: [SLMB]
    effective_from: 2026-01-01
    parameters: [ca.msp.slmb_income_limit_monthly]
    overrides: [MSP-FED-SLMB-INCOME]
    implemented_in: playbooks/msp/states/ca/rules.py:_tier
    confidence: confirmed
    note: See MSP-CA-CONFLICT-02 on "less than" versus "or below" at exactly 120%.
    sources:
      - {source: ca-dhcs-fpl-2026-programs, locator: "120% FPL = < Specified Low-Income Medicare Beneficiaries (SLMB); Notes: '<' means eligible if budget unit income is less than income limit"}
      - {source: ca-dhcs-fpl-2026-monthly, locator: "120% column: 1596 / 2165"}
      - {source: ca-dhcs-mc-14a, locator: "SLMB: Net countable income below 120% of the FPL"}
  - id: MSP-CA-QI-INCOME
    statement: >-
      In California in 2026, a person with Medicare Part A whose net
      countable income is at least the SLMB standard and less than $1,796 a
      month (one person) or $2,436 (couple), and who does not have Medi-Cal,
      qualifies for QI, which pays the Part B premium; gross Social Security
      of $1,616 to $1,815 (single) qualifies.
    kind: eligibility
    applies_to: [QI]
    effective_from: 2026-01-01
    parameters: [ca.msp.qi_income_limit_monthly]
    overrides: [MSP-FED-QI-INCOME]
    implemented_in: playbooks/msp/states/ca/rules.py:_tier
    confidence: confirmed
    sources:
      - {source: ca-dhcs-fpl-2026-programs, locator: "135% FPL = < Qualified Individual 1 Program (QI-1)"}
      - {source: ca-dhcs-fpl-2026-monthly, locator: "135% column: 1796 / 2436"}
      - {source: ca-dhcs-msp-page, locator: "Qualifying Individual (Must Have Medicare Part A and cannot also receive Medi-Cal): Monthly – $1,796 / $2,436"}
  - id: MSP-CA-INCOME-METHOD
    statement: >-
      When California counties count income for QMB, SLMB or QI, they
      subtract a $20 "any income deduction" (once per budget) and, from
      earnings, $65 plus one-half of the rest, and they do not deduct Medicare
      or other health insurance premiums.
    kind: definition
    applies_to: [QMB, SLMB, QI]
    effective_from: 1997-10-22
    parameters: [ca.msp.income_disregard_monthly, federal.ssi.earned_income_exclusion_monthly]
    overrides: [MSP-FED-INCOME-SSI-METHOD]
    implemented_in: playbooks/msp/federal/rules.py:countable_income_of
    confidence: confirmed
    sources:
      - {source: ca-dhcs-mc-14a, locator: "A. Countable income, lines m-s: Subtract $65 ... Divide by 2 ... Minus $20 (any income deduction)"}
      - {source: ca-dhcs-mepm-5l, locator: "J.2.b) step 4: the $65 and 1/2 deduction; the IRWE deduction; ... the $20 Any Income Deduction"}
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4", quote: "Medicare and health insurance premiums are not allowed as an income deduction for MSPs."}
  - id: MSP-CA-NO-EXTRA-DISREGARD
    statement: >-
      California does not apply the Aged, Blind and Disabled program's
      additional income disregards (or its Part B premium disregard) to the
      Medicare Savings Programs: MSP eligibility uses only the $20 any income
      deduction and the earned income deductions against 100%, 120% and 135%
      of the poverty level.
    kind: definition
    applies_to: [QMB, SLMB, QI]
    effective_from: 2023-02-24
    confidence: confirmed
    note: >-
      Inference from ACWDL 23-05 (MSP income methodology unchanged, MEPM
      Articles 5J/5L, premiums not deductible) and ACWDL 25-26, whose Part B
      premium disregard is stated for the ABD FPL program only. Answers the
      brief's question whether California's extra aged/disabled disregards
      reach the MSPs: no primary source says they do.
    sources:
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4, There are no changes to existing policy regarding the MSP Income Determination"}
      - {source: ca-dhcs-acwdl-25-26, locator: "Medicare Part B Disregard Reminder", quote: "counties must disregard income equal to the amount of the individual's Medicare Part B premium when determining eligibility for the ABD FPL program"}
  - id: MSP-CA-FPL-EFFECTIVE
    statement: >-
      California applies each year's new MSP income standards from January 1
      for applicants and members without Social Security (RSDI) income, and
      from March 1 for those who receive RSDI income (for 2026: March 1,
      2026); until then an RSDI recipient is measured against the previous
      year's standards.
    kind: timing
    applies_to: [QMB, SLMB, QI]
    effective_from: 2025-01-01
    parameters: [ca.msp.new_fpl_month_rsdi]
    implemented_in: playbooks/msp/states/ca/rules.py:_standards_date
    confidence: confirmed
    note: See MSP-CA-CONFLICT-01 (ACWDL 25-26 says April 1 for the COLA disregard).
    sources:
      - {source: ca-dhcs-acwdl-26-01, locator: "page 1, MSP bullets"}
      - {source: ca-dhcs-acwdl-25-01, locator: "page 1, MSP bullets"}
      - {source: ca-dhcs-fpl-2026-programs, locator: "Notes, last paragraph"}
  - id: MSP-CA-COLA
    statement: >-
      In California the January Social Security cost-of-living increase is not
      counted for the Medicare Savings Programs until the new year's poverty
      levels take effect for the case (for RSDI recipients, through February
      2026 under ACWDL 26-01).
    kind: timing
    applies_to: [QMB, SLMB, QI]
    effective_from: 2026-01-01
    overrides: [MSP-FED-COLA-TRANSITION]
    implemented_in: playbooks/msp/federal/rules.py:cola_excluded
    confidence: confirmed
    note: >-
      ACWDL 25-26 ties the COLA disregard to the new FPL taking effect and
      names April 1, 2026; ACWDL 26-01 (later) puts the MSP switch for RSDI
      cases at March 1. The evaluator uses January-February (the federal
      transition months), which matches ACWDL 26-01; MSP-CA-CONFLICT-01.
    sources:
      - {source: ca-dhcs-acwdl-25-26, locator: "Processing the 2026 SSA COLA for Non-MAGI Eligibility Groups", quote: "The 2026 SSA COLA will be disregarded from the eligibility determination for the Aged, Blind, and Disabled Federal Poverty Level (ABD FPL), and Medicare Savings Programs (MSPs) until the 2026 FPL rates take effect on April 1, 2026"}
      - {source: ca-dhcs-mc-14a, locator: "footnote: If you received a Title II Social Security cost of living adjustment in January, this amount will not be counted until April."}
  - id: MSP-CA-COUPLE
    statement: >-
      In California, a married applicant living with a spouse is budgeted
      with the spouse's income against the poverty level for two (Medi-Cal
      methodology); if that makes the applicant ineligible and the spouse is
      not an MSP applicant, the county also tries SSI methodology, under which
      a low-income spouse's income can be exempt and the applicant is measured
      alone against the poverty level for one.
    kind: definition
    applies_to: [QMB, SLMB, QI]
    effective_from: 1997-10-22
    overrides: [MSP-FED-COUPLE-INCOME]
    implemented_in: playbooks/msp/states/ca/rules.py:evaluate
    confidence: confirmed
    sources:
      - {source: ca-dhcs-mepm-5l, locator: "J.2.b) SSI Income Methodology - Overview; J.3.b) steps 1-5 (use the FPL for one ... or the FPL for two)"}
      - {source: ca-dhcs-mc-14a, locator: "A.2: If you are married and living with your SPOUSE, fill in the MONTHLY unearned income received by your spouse"}
  - id: MSP-CA-INELIGIBLE-SPOUSE
    statement: >-
      In California, under SSI income methodology for an MSP applicant whose
      spouse is not applying, the spouse's income is exempt if it is no more
      than the "Standard SSI Allocation"; the 2026 amount of that allocation
      is not established in this archive.
    kind: definition
    applies_to: [QMB, SLMB, QI]
    effective_from: 1997-10-22
    parameters: [ca.msp.standard_ssi_allocation_monthly]
    implemented_in: playbooks/msp/states/ca/rules.py:evaluate
    confidence: unresolved
    open_question: MSP-CA-OQ-04
    sources:
      - {source: ca-dhcs-mepm-5l, locator: "J.2.b) and J.3.b) step 3"}
  - id: MSP-CA-ASSET-LIMIT
    statement: >-
      In California, from January 1, 2026, a person qualifies for QMB, SLMB,
      QI or QDWI only if countable property (assets) is no more than $130,000
      for one person or $195,000 for a couple ($65,000 more for each
      additional household member, up to ten).
    kind: eligibility
    applies_to: [QMB, SLMB, QI, QDWI]
    effective_from: 2026-01-01
    parameters: [ca.msp.asset_test_applies, ca.msp.asset_limit]
    overrides: [MSP-FED-RESOURCES]
    implemented_in: playbooks/msp/states/ca/rules.py:_asset_test
    confidence: confirmed
    sources:
      - {source: ca-dhcs-acwdl-25-27, locator: "MSP 2026 Property Limits", quote: "Effective January 1, 2026, the asset limits used to determine MSP eligibility are $130,000 for an individual, $195,000 for a couple."}
      - {source: ca-dhcs-acwdl-25-14, locator: "Policy Change; programs chart incl. QMB (80), QDWI (8A), SLMB (8C), QI (8D); Household Asset Limits table"}
      - {source: ca-dhcs-msp-page, locator: "Starting January 1, 2026, the asset limits to determine MSP eligibility ..."}
  - id: MSP-CA-NO-ASSET-TEST-2024-2025
    statement: >-
      California had no asset (property) limit for QMB, SLMB, QI or QDWI from
      January 1, 2024 through December 31, 2025; from July 1, 2022 through
      December 31, 2023 the limit was $130,000 for one person and $195,000 for
      two.
    kind: eligibility
    applies_to: [QMB, SLMB, QI, QDWI]
    effective_from: 2022-07-01
    effective_to: 2025-12-31
    parameters: [ca.msp.asset_test_applies, ca.msp.asset_limit]
    implemented_in: playbooks/msp/states/ca/rules.py:_asset_test
    confidence: confirmed
    sources:
      - {source: ca-dhcs-acwdl-22-25, locator: "Purpose; Policy"}
      - {source: ca-dhcs-acwdl-22-28, locator: "Medicare Savings Program 2023 Property Limits"}
      - {source: ca-dhcs-acwdl-25-27, locator: "Important"}
  - id: MSP-CA-ASSET-TRANSITION
    statement: >-
      In California, an MSP application filed before January 1, 2026 is
      decided without the property test even if the decision is made later,
      and an existing member becomes subject to the reinstated $130,000 /
      $195,000 limit only at the first annual renewal (or change-in-
      circumstance redetermination with assets verified ex parte) on or after
      January 1, 2026; no assets are verified for retroactive months before
      2026.
    kind: timing
    applies_to: [QMB, SLMB, QI, QDWI]
    effective_from: 2026-01-01
    parameters: [ca.msp.asset_test_start_application_date]
    implemented_in: playbooks/msp/states/ca/rules.py:_asset_test
    confidence: confirmed
    sources:
      - {source: ca-dhcs-acwdl-25-14, locator: "Impacted Populations; Application; Examples #1-#4"}
  - id: MSP-CA-ASSET-CURE-PERIOD
    statement: >-
      In California, a Medi-Cal or MSP member whose renewal is due on or after
      January 1, 2026 and who is cut off for not giving asset information has
      a 90-day cure period: if the information arrives within 90 days and the
      person is under the limit, coverage is restored as if it had been
      timely.
    kind: procedure
    applies_to: [QMB, SLMB, QI, QDWI]
    effective_from: 2026-01-01
    confidence: confirmed
    sources:
      - {source: ca-dhcs-acwdl-25-14, locator: "Annual Renewal, paragraph 3"}
  - id: MSP-CA-PART-A
    statement: >-
      In California a person must have Medicare Part A to qualify for QMB,
      SLMB or QI (the only exception is a person with the Medicare Part B
      immunosuppressive-drug benefit, who may get an MSP without Part A).
    kind: eligibility
    applies_to: [QMB, SLMB, QI]
    effective_from: 2023-01-01
    implemented_in: playbooks/msp/states/ca/rules.py:evaluate
    confidence: confirmed
    sources:
      - {source: ca-dhcs-msp-page, locator: "QMB (Must Be Entitled to Medicare Part A); SLMB (Must Have Medicare Part A)"}
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4: individuals are not required to be Medicare Part A eligible for QMB, SLMB or QI (Part B-ID)"}
  - id: MSP-CA-PART-A-BUY-IN
    statement: >-
      Since January 1, 2025 California is a Medicare Part A buy-in state:
      DHCS automatically enrolls full-scope Medi-Cal members who have Part B
      and qualify for QMB into Part A and pays their Part A premium; whether
      the buy-in also gives Part A to a QMB-only applicant who is not on
      Medi-Cal and has no Part A has not been established.
    kind: coordination
    applies_to: [QMB]
    effective_from: 2025-01-01
    implemented_in: playbooks/msp/states/ca/rules.py:evaluate
    confidence: unresolved
    open_question: MSP-CA-OQ-02
    sources:
      - {source: ca-dhcs-medil-i25-01, locator: "Background", quote: "Effective January 1, 2025, California has transitioned to a Medicare Part A Buy-In State."}
      - {source: ca-dhcs-buyin-page, locator: "Part A Buy-In Agreement"}
      - {source: ca-dhcs-acwdl-26-12, locator: "Part A Buy-in policy changes"}
  - id: MSP-CA-SSI-AUTO-QMB
    statement: >-
      In California, SSI/SSP recipients with full-scope Medi-Cal and Medicare
      Part B were automatically enrolled in QMB (aid code 80) by DHCS from
      October 2024 (premium-free Part A) and January 1, 2025 (all), so they do
      not need to file an MSP application; people who do not receive SSI/SSP
      must apply.
    kind: coordination
    applies_to: [QMB]
    effective_from: 2025-01-01
    confidence: confirmed
    sources:
      - {source: ca-dhcs-medil-i25-01, locator: "Qualified Medicare Beneficiary (QMB) Program; QMB Program Reminders for the Non-SSI/Non-SSP Individuals"}
  - id: MSP-CA-QI-NOT-MEDI-CAL
    statement: >-
      In California a person cannot have QI while receiving Medi-Cal; whether
      a person with share-of-cost (medically needy) Medi-Cal is barred from QI
      has not been established. QMB and SLMB can be held with Medi-Cal.
    kind: coordination
    applies_to: [QI]
    effective_from: 2026-01-01
    overrides: [MSP-FED-QI-NOT-MEDICAID]
    implemented_in: playbooks/msp/states/ca/rules.py:evaluate
    confidence: confirmed
    note: The share-of-cost case is open (MSP-CA-OQ-01); the evaluator returns undetermined for it.
    sources:
      - {source: ca-dhcs-msp-page, locator: "Qualifying Individual (Must Have Medicare Part A and cannot also receive Medi-Cal)"}
      - {source: usc-42-1396a, locator: "(a)(10)(E)(iv)"}
  - id: MSP-CA-QDWI
    statement: >-
      In California in 2026, QDWI (payment of the Part A premium only) is for
      people under 65 who lost premium-free Part A because they returned to
      work and do not receive Medi-Cal, with income up to 200% of the poverty
      level ($2,660 a month single, $3,608 couple) and, from January 1, 2026,
      property of no more than $130,000 (single) or $195,000 (couple).
    kind: eligibility
    applies_to: [QDWI]
    effective_from: 2026-01-01
    parameters: [ca.msp.qdwi_income_limit_monthly, ca.msp.asset_limit]
    overrides: [MSP-FED-QDWI]
    implemented_in: playbooks/msp/states/ca/rules.py:_qdwi
    confidence: confirmed
    note: >-
      The $130,000 property limit for QDWI is far above the federal QDWI
      resource limit (twice the SSI limit, $4,000 / $6,000); ACWDL 25-14 lists
      QDWI (aid code 8A) among programs with the $130,000 limit. Whether the
      200% figure is compared to income before or after earned income
      deductions is open (MSP-CA-OQ-07).
    sources:
      - {source: ca-dhcs-msp-page, locator: "Qualified Disabled and Working Individual: Monthly – $2,660 / $3,608"}
      - {source: ca-dhcs-acwdl-25-14, locator: "programs chart, page 9: Qualified Disabled Working Individual (QWDI) 8A"}
  - id: MSP-CA-QMB-EFFECTIVE
    statement: >-
      In California QMB has no retroactive months and starts the month after
      eligibility is established; DHCS's procedures manual and county letter
      say the month after the county approves the case, while the 2026 notice
      text says the month after the person applies.
    kind: timing
    applies_to: [QMB]
    effective_from: 2023-02-24
    overrides: [MSP-FED-QMB-EFFECTIVE]
    confidence: unresolved
    open_question: MSP-CA-OQ-06
    sources:
      - {source: ca-dhcs-mepm-5l, locator: "B.2 Effective Date", quote: "Benefits are effective the first of the month following the date of approval ... There are no retroactive QMB benefits."}
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4", quote: "The QMB eligibility start date is the month after the county has processed the case as described in MEPM Article 5L."}
      - {source: ca-dhcs-acwdl-26-12, locator: "QMB Approval snippet", quote: "QMB eligibility starts the month after you apply."}
  - id: MSP-CA-RETRO
    statement: >-
      In California, SLMB and QI can be paid for up to three months before the
      month of application for applications made before January 1, 2027;
      for applications on or after January 1, 2027 DHCS's preliminary guidance
      limits retroactive Medi-Cal coverage for groups other than the MAGI new
      adult group to two months.
    kind: timing
    applies_to: [SLMB, QI]
    effective_from: 2023-01-01
    overrides: [MSP-FED-RETRO-SLMB-QI, MSP-FED-RETRO-2027]
    confidence: confirmed
    note: >-
      ACWDL 26-07 does not name the MSPs; applying its two-month limit to SLMB
      and QI is a direct inference ("all other Medi-Cal eligibility groups"),
      and the letter is marked preliminary. Answers MSP-FED-OQ-02 for
      California only.
    sources:
      - {source: ca-dhcs-acwdl-23-05, locator: "page 4", quote: "SLMB and QI eligibility may be allowed retroactively for up to three months"}
      - {source: ca-dhcs-mc-14a, locator: "Do you wish to apply for three months of retroactive coverage for the SLMB and QI programs (there is no retroactive coverage for QMB)."}
      - {source: ca-dhcs-acwdl-26-07, locator: "Background; Policy Change", quote: "All Other Medi-Cal Eligibility Groups: Retroactive Medi-Cal coverage is limited to 2 months prior to the month of application."}
  - id: MSP-CA-REPORT-CHANGES
    statement: >-
      California Medi-Cal and MSP members must report changes that affect
      eligibility to the county within 10 days; from January 1, 2026 that
      includes changes in assets once assets have been used in their
      determination.
    kind: procedure
    effective_from: 2026-01-01
    confidence: confirmed
    sources:
      - {source: ca-dhcs-acwdl-25-14, locator: "Change in Circumstance"}

procedure:
  applications:
    - id: MSP-CA-PROC-MC14A
      text: >-
        To apply only for an MSP, fill in the MC 14A (QMB, SLMB and QI
        Application) and mail it to the Medicare Savings Program contact at the
        county social services office; it asks whether to request three
        months of retroactive SLMB/QI coverage. The printed dollar figures on
        the 5/22 form are out of date.
      form_number: MC 14A
      form_name: Qualified Medicare Beneficiary (QMB), Specified Low-Income Medicare Beneficiary (SLMB), and Qualifying Individual (QI) Application
      url: https://www.dhcs.ca.gov/file/mc14a-eng-2-pdf/
      channel: mail
      confidence: confirmed
      sources:
        - {source: ca-dhcs-msp-page, locator: "If you only want to apply for a Medicare Savings Program, you may fill out the application (MC 14A) and mail it to the Medicare Savings Program contact at your local county office."}
        - {source: ca-dhcs-mc-14a, locator: "page 1"}
