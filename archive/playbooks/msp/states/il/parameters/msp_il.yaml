# Illinois Medicare Savings Program standards (IDHS WAG 25-03-02(2), set by
# MR #26.11). Illinois publishes income *bands* for countable income (after
# its own $25 income exemption, rounded down to the dollar), not "+$20"
# gross figures, so these are compared to countable income.
parameters:
  - id: il.msp.qmb_income_limit_monthly
    description: Illinois QMB monthly income standard (100% FPL).
    compare_to: >-
      Countable monthly income under AABD Community budgeting (after the $25 income exemption, the AABD earned income disregard and employment expenses), rounded down to the dollar; eligible if equal to or less than this amount.
    unit: usd_per_month
    keyed_by: household_size (1 = individual, 2 = couple)
    updates: Each spring by Manual Release, effective January 1 (MR #26.11); applied to active cases by an April mass change.
    values:
      - effective_from: 2026-01-01
        value: {1: 1330, 2: 1803}
        confidence: confirmed
        sources:
          - {source: il-idhs-wag-25-03-02-msp, locator: "AABD Medical/Medicare Savings Programs/HBWD, 2026 Monthly Income Standards, QMB 100% FPL column", quote: "QMB 100% FPL ... 1 ... $ 1,330 ... 2 ... 1,803"}
          - {source: il-idhs-mr-26-11, locator: "Increase in the Monthly Medical Income Standards", quote: "The revised standards are effective 01/01/26 for all programs except Medicaid Presumptive Eligibility (MPE)."}
  - id: il.msp.slib_income_limit_monthly
    description: Highest countable income in Illinois's published 2026 SLIB band ("Over 100% to $1 less than 120%").
    compare_to: >-
      Countable monthly income (rounded down to the dollar); SLIB if above the QMB standard and equal to or less than this amount.
    unit: usd_per_month
    keyed_by: household_size
    updates: With the QMB standard.
    values:
      - effective_from: 2026-01-01
        value: {1: 1595, 2: 2163}
        confidence: confirmed
        note: PM 06-13-00 says SLIB income is "not more than 120%" of FPL, which would put $1,596 single in SLIB; the WAG band puts it in QI-1 (conflict MSP-IL-CONFLICT-02).
        sources:
          - {source: il-idhs-wag-25-03-02-msp, locator: "SLIB Over 100% to $1 less than 120% column", quote: "$ 1,331 - 1,595 ... 1,804 - 2,163"}
  - id: il.msp.qi_income_limit_monthly
    description: Highest countable income in Illinois's published 2026 QI-1 band ("120% to $1 less than 135% FPL").
    compare_to: >-
      Countable monthly income (rounded down to the dollar); QI-1 if above the SLIB band and equal to or less than this amount.
    unit: usd_per_month
    keyed_by: household_size
    updates: With the QMB standard.
    values:
      - effective_from: 2026-01-01
        value: {1: 1794, 2: 2433}
        confidence: confirmed
        sources:
          - {source: il-idhs-wag-25-03-02-msp, locator: "QI-1 120% to $1 less than 135% FPL column", quote: "$ 1,596 - 1,794 ... 2,164 - 2,433"}
  - id: il.msp.qi_income_limit_pm_text_monthly
    description: >-
      Highest whole-dollar countable income that is "equal to or less than
      135% of the FPL" (PM 06-14-01-b) — one dollar above the WAG's QI-1 band.
      Used only to flag the disputed dollar (conflict MSP-IL-CONFLICT-03).
    compare_to: Countable monthly income rounded down to the dollar.
    unit: usd_per_month
    keyed_by: household_size
    updates: With the QMB standard.
    values:
      - effective_from: 2026-01-01
        value: {1: 1795, 2: 2434}
        confidence: confirmed
        note: >-
          Derived: 135% of the 2026 HHS guideline is $1,795.50 (one) and
          $2,434.50 (two) a month; the largest whole-dollar countable income at
          or below it is $1,795 / $2,434. The PM text gives the percentage, not
          the dollar figure.
        sources:
          - {source: il-idhs-pm-06-14-01-b, locator: "The QI-1 income standard is more than 120% of the Federal Poverty Level (FPL), but equal to or less than 135% of the FPL."}
          - {source: fr-2026-hhs-poverty-guidelines, locator: "2026 Poverty Guidelines table, 48 contiguous states: 1 person $15,960; 2 persons $21,640"}
  - id: il.msp.income_exemption_monthly
    description: Illinois's $25 income exemption (AABD income disregard) for QMB, SLIB and QI-1, from earned or unearned income other than SSI.
    unit: usd_per_month
    updates: Fixed (state rule).
    values:
      - effective_from: 1997-03-01
        value: 25
        confidence: confirmed
        sources:
          - {source: il-idhs-pm-06-12-01-c, locator: "PM 06-12-01-c Income Exemption", quote: "The first $25 of earned or unearned income, other than SSI income, is exempt when determining eligibility for QMB."}
          - {source: il-idhs-pm-15-04-03-a-msp, locator: "AABD Income Disregard (Community Cases)"}
  - id: il.aabd.earned_income_disregard_flat_monthly
    description: Illinois AABD (aged or disabled) earned income disregard, flat part — the first $20 of earned income.
    unit: usd_per_month
    updates: Fixed (state rule).
    values:
      - effective_from: 1997-03-01
        value: 20
        confidence: confirmed
        sources:
          - {source: il-idhs-pm-08-02-03-a, locator: "Aged or Disabled - AABD(A) or (D)", quote: "disregard the first $20 of earned income plus 1/2 of the next $60."}
  - id: il.aabd.earned_income_disregard_half_band_monthly
    description: Illinois AABD (aged or disabled) earned income disregard — one-half of the next $60 of earned income after the first $20.
    unit: usd_per_month
    updates: Fixed (state rule).
    values:
      - effective_from: 1997-03-01
        value: 60
        confidence: confirmed
        sources:
          - {source: il-idhs-pm-08-02-03-a, locator: "Aged or Disabled - AABD(A) or (D)", quote: "plus 1/2 of the next $60."}
  - id: il.msp.cola_disregard_last_month
    description: Last month of the year (month number) in which Illinois does not count the January Social Security COLA for QMB, SLIB and QI-1.
    unit: month_number
    updates: Fixed (state rule).
    values:
      - effective_from: 2009-01-01
        value: 3
        confidence: confirmed
        sources:
          - {source: il-idhs-pm-06-12-01-b, locator: "QMB Income Limit", quote: "Do not use the annual January Social Security cost of living adjustment (COLA) increase in deciding QMB eligibility for January, February, and March."}
          - {source: il-idhs-pm-06-13-01-b, locator: "SLIB Income Limit"}
          - {source: il-idhs-pm-06-14-01-b, locator: "QI-1 Income Limit"}
  - id: il.msp.resource_limit
    description: Illinois resource limit for QMB, SLIB and QI-1 (the federal MSP resource level).
    compare_to: >-
      Nonexempt resources of the persons in the income standard (applicant and spouse), under AABD resource rules (PM 07-02-00); PM 06-12-01 says resources must be LESS than the standard (conflict MSP-IL-CONFLICT-01).
    unit: usd
    keyed_by: household_size (1 = one person, 2 = two or more people)
    updates: Yearly, with the federal MSP / Part D LIS resource level; posted in WAG 25-03-02(2).
    values:
      - effective_from: 2025-01-01
        effective_to: 2025-12-31
        value: {1: 9660, 2: 14470}
        confidence: confirmed
        sources:
          - {source: il-idhs-wag-25-03-02-msp, locator: "Resources table, Medicare Savings Programs row", quote: "9,660 (2025) ... 14,470 (2025)"}
          - {source: il-idhs-mr-25-15, locator: "Resource Limit for Medicare Savings Program (MSP)"}
      - effective_from: 2026-01-01
        value: {1: 9950, 2: 14910}
        confidence: confirmed
        sources:
          - {source: il-idhs-wag-25-03-02-msp, locator: "Resources table, Medicare Savings Programs row", quote: "9,950 (2026) ... 14,910 (2026)"}
          - {source: il-idhs-mr-26-11, locator: "Resource Limit for Medicare Savings Program (MSP)"}
  - id: il.msp.qdwi_income_limit_monthly
    description: Illinois QDWI income limit (not more than 200% FPL), using the 200% FPL figures IDHS publishes for 2026.
    compare_to: >-
      Countable monthly income; the archive measures it with SSI methodology because PM 06-06-03 gives no budgeting method (MSP-IL-OQ-06).
    unit: usd_per_month
    keyed_by: household_size
    updates: Yearly with the FPL.
    values:
      - effective_from: 2026-01-01
        value: {1: 2660, 2: 3606}
        confidence: confirmed
        note: The figures are the WAG's 200% FPL column (labelled for Refugee Medical Assistance); PM 06-06-03 sets QDWI at 200% FPL without a dollar table.
        sources:
          - {source: il-idhs-pm-06-06-03, locator: "To be eligible for QDWI a person must: have an income of not more than 200% of the Federal Poverty Level"}
          - {source: il-idhs-wag-25-03-02-msp, locator: "2026 Monthly Income Standards, (RMA AABD) 200% FPL column", quote: "$2,660 ... 3,606"}
  - id: il.msp.qdwi_resource_limit
    description: Illinois QDWI resource limit (twice the SSI resource limit).
    compare_to: Countable resources of the individual or couple.
    unit: usd
    keyed_by: household_size
    updates: Only if the SSI resource limit changes.
    values:
      - effective_from: 1997-03-01
        value: {1: 4000, 2: 6000}
        confidence: confirmed
        note: PM 06-06-03 says "not more than twice the SSI level for an individual or couple"; the SSI levels are $2,000 / $3,000 (shared parameter federal.ssa.ssi_resource_limit).
        sources:
          - {source: il-idhs-pm-06-06-03, locator: "have assets of not more than twice the SSI level for an individual or couple"}
          - {source: ssa-poms-hi-00815-023, locator: "4. QDWI, Resource Limits"}
