open_questions:
  - id: MSP-NY-OQ-01
    priority: medium
    question: Which Medicare beneficiaries can apply for the MSP online through NY State of Health, and is there a separate online route for MSP-only applicants?
    why_it_matters: The agent should offer the fastest filing route that actually accepts the member's application.
    checked: [NY DOH Medicare Savings Program 2026 page, DOH-4328 instructions, GIS 23 MA/10 title only]
    affects: [MSP-NY-FILE-ONLINE]
    status: open
  - id: MSP-NY-OQ-02
    priority: high
    question: >-
      After a New York MSP approval, how many months until SSA stops
      deducting the Part B premium (how soon does the LDSS/HRA open the
      eMedNY Buy-In span after approval, and does DOH publish an expected
      wait)? Narrowed: how already-deducted months are refunded, and what
      notice the member gets, are answered federally (MSP-FED-BUYIN-REFUND,
      MSP-FED-BUYIN-NOTICE).
    why_it_matters: This is the outcome proof; members will ask when their check goes up.
    checked: [NY DOH MSP page, DOH-4328 and instructions, GIS 22 MA/10, GIS 23 MA/10, GIS 26 MA/05, 00 OMM/ADM-7, NYSOFA HIICAP Module 9, SSA POMS HI 00815.039, HI 01001.205, CMS buy-in manual ch. 1-2]
    affects: [MSP-NY-PROOF-SSA, MSP-NY-PROOF-SSA-BUYIN-NOTICE, MSP-NY-TIME-DEDUCTION-STOPS, MSP-NY-BUYIN-SPAN]
    status: open
  - id: MSP-NY-OQ-03
    priority: medium
    question: Is there a DOH directive confirming automatic QMB enrollment for SSI recipients in New York?
    why_it_matters: SSI recipients should not be told to file a DOH-4328 if enrollment is automatic.
    checked: [NYSOFA HIICAP Module 9]
    affects: [MSP-NY-SSI-AUTO]
    status: open
  - id: MSP-NY-OQ-04
    priority: medium
    question: What is the primary (CMS or DOH) source for MSP enrollment removing the Part B late enrollment penalty and allowing Part B enrollment outside enrollment periods?
    why_it_matters: Strong selling point for members who delayed Part B; must be right before the agent says it.
    checked: [NYSOFA HIICAP Module 9, SSA POMS HI 00815.001, HI 00815.039, "42 CFR 407.40 and 407.47"]
    affects: [MSP-NY-PART-B-LEP]
    status: answered
    answer: >-
      SSA POMS HI 00815.001 B (buy-in agreements let states enroll members in
      Part B at any time, and states pay no late-enrollment surcharge), 42 CFR
      407.40(c)(1) and 407.47(g) (buy-in group members can enroll in Part B at
      any time), and HI 00815.039 A-B (Part B is established from the first
      buy-in month; after buy-in ends the premium is the base amount even if a
      surcharge was paid before). New York's MSP groups are in its buy-in
      (GIS 23 MA/10, GIS 26 MA/05). See MSP-NY-PART-B-LEP.
  - id: MSP-NY-OQ-05
    priority: medium
    question: Does OTDA 02 ADM-07 (SNAP medical deduction freeze between certifications) still apply in 2026?
    why_it_matters: Members on SNAP need to know their food benefit will not drop right away.
    checked: [NYSOFA HIICAP Module 9 (cites 02 ADM-07)]
    affects: [MSP-NY-SNAP-EFFECT]
    status: open
  - id: MSP-NY-OQ-06
    priority: low
    question: Retrieve GIS 10 MA/008 to confirm the estate recovery exemption for MSP benefits.
    why_it_matters: Families worry about estate recovery; a wrong answer can stop someone from enrolling.
    checked: [NYSOFA HIICAP Module 9]
    affects: [MSP-NY-ESTATE]
    status: open

conflicts:
  - id: MSP-NY-CONFLICT-01
    topic: When QMB coverage starts
    claims:
      - source: usc-42-1396a
        locator: "(e)(8)"
        says: QMB applies to services furnished after the end of the month in which the QMB determination first occurs.
      - source: ny-gis-07-ma-027
        locator: "last paragraph"
        says: Eligibility for QMB begins the first of the month following the date of the application.
      - source: nysofa-hiicap-msp-2026
        locator: "summary chart"
        says: QMB is effective in the month following the month of application.
    handling: >-
      The archive states New York's rule (month after application) because the
      member deals with New York's practice, and keeps the federal rule on
      record. A benefits expert should confirm New York's current practice and
      how it is squared with 1902(e)(8).
    affects: [MSP-NY-QMB-EFFECTIVE, MSP-FED-QMB-EFFECTIVE]
    status: open
  - id: MSP-NY-CONFLICT-02
    topic: Whether income exactly at the top limit qualifies
    claims:
      - source: ny-gis-26-ma-05-att1
        says: "QMB at 138% FPL; QI greater than 138% but less than or equal to (≤) 186% FPL."
      - source: ny-gis-22-ma-10
        says: "QMB 0% up to and equal to 138%; QI above 138% and up to and equal to 186%."
      - source: ny-doh-msp-2026
        says: "QMB: Income at or Below 138% FPL; QI: Income Below 186% FPL."
      - source: nysofa-hiicap-msp-2026
        says: "Summary chart: QMB Under $1,856; QI $1,857 to $2,494."
    handling: >-
      The rules use "at or below" for both tiers, following the two DOH
      directives (GIS 22 MA/10 and the 2026 chart), which are the binding
      instructions to districts. Tests pin the at-limit case.
    affects: [MSP-NY-QMB-INCOME, MSP-NY-QI-INCOME]
    status: open
  - id: MSP-NY-CONFLICT-03
    topic: QDWI income figure
    claims:
      - source: ny-gis-26-ma-05-att1
        says: QDWI 200% FPL is $2,660 single / $3,607 couple.
      - source: nysofa-hiicap-msp-2026
        says: QDWI monthly income up to $2,680 / $3,627, including the $20 disregard.
      - source: ssa-poms-hi-00815-023
        says: QDWI federal limit is $5,405 / $7,299 because the figures incorporate earned income disregards.
    handling: >-
      Not a real disagreement once the disregards are applied: all three are
      200% FPL measured at different points. The rules compare countable income
      (after the $20 and $65-plus-half disregards) to $2,660 / $3,607.
    affects: [MSP-NY-QDWI]
    status: resolved

claims_checked:
  - claim: New York has no asset test for the Medicare Savings Program.
    verdict: verified
    detail: The 2026 DOH chart says "No Resource Test" for QMB and QI. QDWI does have a resource limit ($4,000 / $6,000).
    sources: [{source: ny-gis-26-ma-05-att1, locator: "Non-MAGI table"}]
  - claim: Its income limits are 138% of the federal poverty level for the top tier (QMB) and 186% for the premium-only tier (QI).
    verdict: verified
    detail: >-
      Correct percentages. Note that QMB is the more generous benefit but the
      lower income band (at or below 138%); QI covers the band above it up to
      186%.
    sources: [{source: ny-gis-22-ma-10, locator: "2023 MSP Income limits"}]
  - claim: The 2026 individual QMB limit is $1,856 a month, with a $20 income disregard.
    verdict: partly_verified
    detail: >-
      The 2026 QMB standard is $1,836 a month (138% FPL). $1,856 is that
      standard plus the $20 disregard, i.e. the highest gross income that
      qualifies. Both numbers appear on DOH's 2026 MSP page. The agent should
      quote "$1,856 gross" or "$1,836 after the $20 deduction", not "$1,856
      after the disregard".
    sources: [{source: ny-doh-msp-2026, locator: "QMB: $1,836 per month / +$20: $1,856"}]
  - claim: Enrolling brings Extra Help automatically.
    verdict: verified
    detail: QMB and QI are deemed eligible for Extra Help by CMS (federal rule); QDWI is not.
    sources: [{source: ssa-poms-hi-03001-005, locator: "A."}]
