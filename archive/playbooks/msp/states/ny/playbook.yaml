  - id: MSP-NY-LINK-MEDICAID
    playbook: medicaid
    rules: [MSP-NY-QI-NOT-MEDICAID, MSP-NY-SPENDDOWN-CHOICE]
    relation: New York's QMB income limit equals the SSI-related Medicaid income level ($1,836 / $2,489 in 2026), so QMB-eligible people are usually Medicaid-eligible without a spenddown; QI-range people must choose between QI and Medicaid with a spenddown.
    test: MSP-X-02
    confidence: confirmed
