  - id: federal.usda.dcm_free_fpl_percent
    description: >-
      Direct certification with Medicaid (FNS demonstration): highest income, as measured by
      Medicaid for the Medicaid family size, at which a Medicaid child can be directly
      certified for FREE meals.
    unit: percent_fpl
    updates: Set by FNS in the demonstration terms.
    values:
      - effective_from: 2016-07-01
        value: 130
        confidence: confirmed
        note: The statute's Medicaid direct certification definition, 42 U.S.C. 1758(b)(15)(A), uses 133% of the poverty line before disregards; see conflict SCH-FED-CONFLICT-01.
        sources:
          - source: fns-dcm-demonstration
            locator: "Scope of Demonstration Projects"
            quote: "Free school meal eligibility, 130 percent of the Federal Poverty Level (FPL) for the family size used by Medicaid"
  - id: federal.usda.dcm_reduced_fpl_percent
    description: Direct certification with Medicaid for free and reduced-price meals (DCM-F/RP states only) - highest Medicaid-measured income for REDUCED-PRICE certification.
    unit: percent_fpl
    updates: Set by FNS in the demonstration terms.
    values:
      - effective_from: 2016-07-01
        value: 185
        confidence: confirmed
        sources:
          - source: fns-dcm-demonstration
            locator: "Scope of Demonstration Projects"
            quote: "Reduced price school meal eligibility, 185 percent of the FPL for the family size used by Medicaid"
  - id: federal.usda.cep_min_isp_percent
    description: Minimum identified student percentage (as of April 1 of the prior school year) for a school, group of schools or LEA to elect the Community Eligibility Provision.
    unit: percent
    updates: Changes only by rule.
    values:
      - effective_from: 2023-10-26
        value: 25
        confidence: confirmed
        sources:
          - {source: ecfr-7-cfr-245, locator: "245.9(f)(3)(i)", quote: "must have an identified student percentage of at least 25 percent, as of April 1 of the school year prior to participating"}
          - {source: fr-2023-20294-cep, locator: "SUMMARY and DATES", quote: "This rule is effective October 26, 2023."}
  - id: federal.usda.cep_multiplier
    description: Multiplier applied to the identified student percentage to get the share of CEP meals reimbursed at the free rate (capped at 100%).
    unit: ratio
    updates: Changes only by rule.
    values:
      - effective_from: 2023-10-26
        value: 1.6
        confidence: confirmed
        note: 2023-10-26 is the date of the CFR text relied on; the multiplier predates it.
        sources:
          - {source: ecfr-7-cfr-245, locator: "245.9(f)(4)(v)(A)", quote: "multiply the applicable identified student percentage by a factor of 1.6"}
  - id: federal.usda.application_notice_operating_days
    description: Operating days within which the LEA must notify the household and provide benefits after receiving an income application.
    unit: operating_days
    values:
      - effective_from: 2025-07-01
        value: 10
        confidence: confirmed
        sources:
          - {source: ecfr-7-cfr-245, locator: "245.6(c)(6)(i)", quote: "within 10 operating days of receiving the application from the household"}
  - id: federal.usda.carryover_operating_days
    description: Operating days into the new school year that the prior year's eligibility carries over unless a new determination is made first.
    unit: operating_days
    values:
      - effective_from: 2025-07-01
        value: 30
        confidence: confirmed
        sources:
          - {source: ecfr-7-cfr-245, locator: "245.6(c)(2)", quote: "used only to determine eligibility for the first 30 operating days following the first operating day at the beginning of the school year"}
  - id: federal.usda.verification_sample_percent
    description: Standard verification sample - percent of applications approved as of October 1, selected from error-prone applications.
    unit: percent
    values:
      - effective_from: 2025-07-01
        value: 3
        confidence: confirmed
        sources:
          - {source: ecfr-7-cfr-245, locator: "245.6a(c), standard sample size", quote: "Three (3) percent of all applications approved by the local educational agency for the school year, as of October 1 of the school year, selected from error prone applications"}
          - {source: usc-42-1758, locator: "(b)(3)(D)(i)(I)"}
  - id: federal.usda.verification_deadline
    description: Date (month-day) each school year by which the LEA must complete verification (extensions to December 15 possible).
    unit: month_day
    values:
      - effective_from: 2025-07-01
        value: "11-15"
        confidence: confirmed
        sources:
          - {source: ecfr-7-cfr-245, locator: "245.6a(b)(1)", quote: "not later than November 15 of each school year"}
