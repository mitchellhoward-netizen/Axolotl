    doc_type: statute
    note: >-
      (b)(1) income guidelines (130% / 185%); (b)(3) verification sample;
      (b)(4) direct certification with SNAP; (b)(5) categorical eligibility
      (SNAP, FDPIR, TANF, homeless, runaway, migrant, foster); (b)(12) Head
      Start; (b)(15) direct certification with Medicaid. 2023 edition of the Code.
