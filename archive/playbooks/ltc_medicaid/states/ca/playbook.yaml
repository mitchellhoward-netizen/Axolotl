    affects: [LTC-CA-LOOKBACK, LTC-CA-POI]
    status: open

claims_checked:
  - claim: California reinstated an asset limit for Medi-Cal, reported as $130,000 for one person.
    verdict: verified
    detail: >-
      Effective January 1, 2026 (AB 116, Chapter 21, Statutes of 2025): $130,000 for one person, $195,000
      for two, $65,000 for each additional person up to ten, for Non-MAGI programs including long-term
      care (Pickle, DAC and DW excepted). A community spouse keeps $162,660 on top.
    sources: [{source: ca-dhcs-acwdl-25-14, locator: "Purpose; asset limit table"}, {source: ca-dhcs-acwdl-26-02, locator: "Property Eligibility"}]
  - claim: California historically used a 30-month look-back for nursing facility care, eliminated it with the asset test in 2024; the 2026 position is to be found.
    verdict: corrected
    detail: >-
      The 30-month look-back was not repealed; with no property test in 2024-2025 there were no
      disqualifying transfers. From 2026 the 30-month look-back applies again, but transfers made in
      January 2024 - December 2025 are never reviewed, so the review window grows back month by month
      from July 2026 and reaches the full 30 months for applications from July 1, 2028.
    sources: [{source: ca-dhcs-acwdl-25-18, locator: "Look-Back Period and chart"}]
  - claim: California's personal needs allowance is $35.
    verdict: partly_verified
    detail: DHCS's (old) long-term care Q&A says $35; no 2026 DHCS statement was retrievable.
    sources: [{source: ca-dhcs-ltc-medi-cal-qa, locator: "share of cost answer"}]
  - claim: California's 2026 community spouse resource allowance and MMMNA.
    verdict: verified
    detail: CSRA $162,660 and MMMNA $4,067 a month from January 1, 2026 (ACWDL 26-02). 2026 APPR divisor $14,440 (ACWDL 26-03).
    sources: [{source: ca-dhcs-acwdl-26-02, locator: "Purpose"}, {source: ca-dhcs-acwdl-26-03, locator: "Purpose"}]
