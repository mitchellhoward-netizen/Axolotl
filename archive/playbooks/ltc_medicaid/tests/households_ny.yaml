- id: LTC-NY-T06
  title: Single, gave $100,000 to a grandchild 3 years before applying (New York City facility); savings at the limit
  as_of: '2026-10-01'
  tags:
  - single
  - cross_state
  household:
    state: ny
    members:
    - id: a
      age: 82
      relationship: self
      medicare_part_a: true
      medicare_part_b: true
      facts:
        institutionalized: true
        transfers:
        - date: '2023-10-15'
          amount: 100000
          recipient: other
          resources_at_transfer: 300000
    incomes:
    - kind: social_security
      monthly: 2200
      owner: a
    assets:
    - kind: cash
      value: 33038
      owner: a
    facts:
      ny_region: new_york_city
      nursing_facility_monthly_cost: 15282
      facility_private_rate_monthly: 9000
  expect:
    status: ineligible
    tier: transfer_penalty
    rules_include:
    - LTC-NY-PENALTY-DIVISOR
    amounts:
      penalty_months: 6.54
  compare_states:
    ca:
      status: eligible
      tier: nursing_facility
      rules_include:
      - LTC-CA-LOOKBACK
    il:
      status: ineligible
      tier: transfer_penalty
      amounts:
        penalty_months: 11.12
  note: 'NY: $100,000 / $15,282 (NYC) = 6.54 months. CA: October 2023 is before the 30-month look-back that starts April 2024
    (and January 2024-December 2025 is never reviewed). IL: $100,000 / $9,000 facility rate = 11.12 months (rounded up). In
    IL the $33,038 also exceeds $17,500, but the penalty decides first.'
  crosscheck:
    policyengine: true
