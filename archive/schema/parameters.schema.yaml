# Schema for every */parameters/*.yaml file.
#
# Parameter IDs are global: <scope>.<program-or-agency>.<name>, for example
# federal.hhs.poverty_guideline_annual or ny.msp.qmb_income_limit_monthly.
# Each value is effective-dated. A value of null records a known gap and
# must name an open question.
$schema: https://json-schema.org/draft/2020-12/schema
$id: parameters.schema.yaml
type: object
additionalProperties: false
required: [parameters]
properties:
  parameters:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, description, unit, values]
      properties:
        id: {type: string, pattern: '^(federal|ny|ca|il)\.[a-z0-9_]+(\.[a-z0-9_]+)+$'}
        description: {type: string}
        unit: {type: string, description: "e.g. usd_per_month, usd_per_year, usd, percent_fpl, months, count"}
        keyed_by: {type: string, description: "What the keys of a mapping value mean, e.g. household_size"}
        open_question: {$ref: 'common.schema.yaml#/$defs/oq_id'}
        compare_to:
          type: string
          description: >-
            For limits: exactly what is compared with this number, e.g.
            "countable income after the $20 disregard" or "gross income; the
            figure already includes the $20 disregard". Required (by
            tools/validate.py) for every parameter whose id contains
            income_limit or resource_limit.
        updates: {type: string, description: "When this number usually changes, for the yearly checklist"}
        values:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [effective_from, value, confidence]
            properties:
              effective_from: {$ref: 'common.schema.yaml#/$defs/date'}
              effective_to: {$ref: 'common.schema.yaml#/$defs/date'}
              value: {}
              confidence: {$ref: 'common.schema.yaml#/$defs/confidence'}
              sources: {$ref: 'common.schema.yaml#/$defs/citations'}
              open_question: {$ref: 'common.schema.yaml#/$defs/oq_id'}
              note: {type: string}
