<!doctype html>
<!--
  The screen that goes inside Apple's official iPhone bezel.

  Rendered by scripts/build-phone.mjs at the device's own logical size
  (402x874 for iPhone 17 Pro) at 3x, then composited into the bezel PNG. It is
  not part of the site: only the composited result is shipped.

  Why this exists: the brief asks for "a real iPhone screenshot of a staged,
  fictional conversation in Apple's official device frame". This renders that
  conversation with the real iOS metrics (SF Pro Text at 17pt, iOS bubble
  padding, the safe-area insets of the actual device) so the mockup reads as a
  device screenshot rather than a web page drawn to look like one.

  PLAIN TEXT ONLY. Every screen is a real iMessage thread: incoming grey
  bubbles, outgoing blue ones, a tail on the last bubble of a run, and nothing
  else. There are no cards, panels or status pills — iMessage has no such
  component, and the product itself sends text.

  THIS IS A STAND-IN for a screenshot taken on a real iPhone. When the founder
  supplies one, drop it in and delete this file: the compositing step only needs
  an image the size of the screen rect.

  The page measures itself and records the result on <html data-fit>, so the
  build fails when a thread outgrows the screen instead of shipping a clipped
  conversation.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>phone screen</title>
    <style>
      /* The device's own metrics. iPhone 17 Pro: 402x874pt, safe area 62 top and
         34 bottom. Everything below is sized the way iOS sizes it. */
      :root {
        --screen-w: 402px;
        --screen-h: 874px;
        --safe-top: 62px;
        --safe-bottom: 34px;
        --nav-h: 56px;
        --composer-h: 54px;
        --bubble-in: #e9e9eb;
        --bubble-out: #0b6fe0;
        --secondary: #8a8a8e;
        --hairline: rgba(60, 60, 67, 0.29);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: var(--screen-w);
        height: var(--screen-h);
        overflow: hidden;
        background: #fff;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #000;
      }

      /* ── status bar ─────────────────────────────────────────────────────── */
      .status {
        flex: 0 0 var(--safe-top);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 26px 8px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }

      .status-right {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .status svg {
        display: block;
      }

      /* ── contact header ─────────────────────────────────────────────────── */
      .nav {
        position: relative;
        flex: 0 0 var(--nav-h);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-bottom: 0.5px solid var(--hairline);
      }

      /* iOS keeps the back chevron hard left while the title stays centred. */
      .nav-back {
        position: absolute;
        left: 14px;
        top: 50%;
        display: flex;
        transform: translateY(-50%);
      }

      .nav-body {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .nav img,
      .nav-body img {
        width: 26px;
        height: 26px;
        object-fit: contain;
      }

      .nav-body span {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.1px;
      }

      .nav-stack {
        display: flex;
        align-items: center;
      }

      /* Overlap the group's initials, but not so far that one circle's white
         ring covers the letter of the one before it. */
      .nav-stack .initials + .initials {
        margin-left: -6px;
      }

      /* ── thread ─────────────────────────────────────────────────────────── */
      .thread {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        /* A real conversation is anchored at the bottom: when it is taller than
           the glass, the OLDEST messages are the ones off-screen, clipped above
           the top edge rather than leaving a white gap below the header. */
        justify-content: flex-end;
        gap: 10px;
        margin: 0;
        padding: 12px 16px 8px;
        list-style: none;
        overflow: hidden;
      }

      /* The cut at the top edge is feathered, so a clipped bubble reads as a
         conversation continuing above rather than a rendering artifact. */
      .thread::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 30px;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(to bottom, #fff 0%, rgba(255, 255, 255, 0) 100%);
      }

      .meta {
        align-self: center;
        padding-bottom: 2px;
        font-size: 12px;
        font-weight: 600;
        color: var(--secondary);
      }

      .meta b {
        font-weight: 600;
        color: #6e6e73;
      }

      .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .row.out {
        justify-content: flex-end;
      }

      /* iOS draws a run of messages from one sender tight: the whole run shares
         one bubble tail and the gap inside it is a few pixels. */
      .row.run {
        margin-top: -7px;
      }

      /* The initials an iPhone falls back to when there is no contact photo.
         Lifted above the bubble: the tail's white notch is drawn 26px to the
         left of a bubble, and without this it paints over the avatar beside it
         and cuts the letter down to a "C". */
      .initials {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #d1d1d6;
        color: #48484a;
        font-size: 12px;
        font-weight: 600;
      }

      .initials.sm {
        width: 24px;
        height: 24px;
        font-size: 10.5px;
        box-shadow: 0 0 0 1.5px #fff;
      }

      /* ── the bubble ─────────────────────────────────────────────────────── */
      .bubble {
        position: relative;
        max-width: 272px;
        padding: 9px 15px;
        border-radius: 19px;
        font-size: 17px;
        line-height: 22px;
        letter-spacing: -0.4px;
        word-wrap: break-word;
      }

      .row.in .bubble {
        background: var(--bubble-in);
        color: #000;
      }

      .row.out .bubble {
        background: var(--bubble-out);
        color: #fff;
      }

      /* A group message carries the sender's name inside the bubble, above the
         text, the way iOS prints it when there is no photo. */
      .sender {
        display: block;
        margin-bottom: 1px;
        font-size: 12px;
        font-weight: 600;
        color: #8a8a8e;
      }

      .bubble.has-sender {
        padding-top: 6px;
      }

      /* The tail. iOS puts one on the last bubble of a run, on the sender's
         side. Drawn with two curves behind the bubble: the bubble's own colour,
         then a white notch that carves it back to a point. `z-index: 0` gives
         the bubble its own stacking context so those curves paint over the
         bubble's background instead of disappearing behind it. */
      .bubble.tail {
        z-index: 0;
      }

      .bubble.tail::before,
      .bubble.tail::after {
        content: "";
        position: absolute;
        bottom: 0;
        z-index: -1;
      }

      .row.in .bubble.tail::before {
        left: -7px;
        width: 20px;
        height: 20px;
        background: inherit;
        border-bottom-right-radius: 16px;
      }

      .row.in .bubble.tail::after {
        left: -26px;
        width: 26px;
        height: 20px;
        background: #fff;
        border-bottom-right-radius: 13px;
      }

      .row.out .bubble.tail::before {
        right: -7px;
        width: 20px;
        height: 20px;
        background: inherit;
        border-bottom-left-radius: 16px;
      }

      .row.out .bubble.tail::after {
        right: -26px;
        width: 26px;
        height: 20px;
        background: #fff;
        border-bottom-left-radius: 13px;
      }

      /* ── composer ───────────────────────────────────────────────────────── */
      .composer {
        flex: 0 0 var(--composer-h);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-top: 0.5px solid var(--hairline);
      }

      .plus,
      .mic {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #e9e9eb;
        color: #8a8a8e;
      }

      .plus {
        font-size: 20px;
        line-height: 1;
      }

      .field {
        flex: 1 1 auto;
        padding: 7px 14px;
        border: 0.5px solid var(--hairline);
        border-radius: 999px;
        font-size: 17px;
        line-height: 20px;
        color: #8a8a8e;
      }

      .home {
        flex: 0 0 var(--safe-bottom);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .home span {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: #000;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span id="clock">9:41</span>
      <span class="status-right" aria-hidden="true">
        <!-- iOS status-bar glyphs at their real sizes. -->
        <svg width="19" height="12" viewBox="0 0 19 12" fill="#000">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="1" />
          <rect x="4.6" y="5" width="3.2" height="7" rx="1" />
          <rect x="9.2" y="2.6" width="3.2" height="9.4" rx="1" />
          <rect x="13.8" y="0" width="3.2" height="12" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
          <path d="M1 4.1a10.5 10.5 0 0 1 14 0" />
          <path d="M3.6 6.9a6.8 6.8 0 0 1 8.8 0" />
          <path d="M6.2 9.6a3 3 0 0 1 3.6 0" />
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
          <rect x="0.6" y="0.6" width="22" height="11.8" rx="3.6" stroke="#000" stroke-opacity="0.36" stroke-width="1.1" />
          <rect x="2.2" y="2.2" width="18.8" height="8.6" rx="2.4" fill="#000" />
          <path d="M24.4 4.4v4.2a2.4 2.4 0 0 0 0-4.2Z" fill="#000" fill-opacity="0.42" />
        </svg>
      </span>
    </div>

    <div class="nav">
      <span class="nav-back" aria-hidden="true">
        <svg width="12" height="21" viewBox="0 0 12 21" fill="none">
          <path d="M10.5 1.5 2 10.5l8.5 9" stroke="#007aff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="nav-body" id="nav-body">
        <img src="/public/animation/axolotl-mascot.png" alt="" />
        <span id="contact">Axolotl</span>
      </span>
    </div>

    <ol class="thread" id="thread">
      <li class="meta" id="meta"></li>
    </ol>

    <div class="composer">
      <span class="plus">+</span>
      <span class="field" id="field">iMessage</span>
      <span class="mic" aria-hidden="true">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <rect x="5" y="1" width="6" height="11" rx="3" fill="#8a8a8e" />
          <path d="M2.5 11a5.5 5.5 0 0 0 11 0" stroke="#8a8a8e" stroke-width="1.6" stroke-linecap="round" />
          <path d="M8 16.5V19" stroke="#8a8a8e" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </span>
    </div>

    <div class="home"><span></span></div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'es' ? 'es' : 'en';
      // 'yes' is the consent loop in "How your yes works", 'week' is the hero,
      // 'circles' is the group chat the families coordinate in, and 'weekcol' is
      // one of the four threads of the week section (?i=0..3).
      const asked = params.get('screen');
      const which = ['week', 'circles', 'weekcol'].includes(asked) ? asked : 'yes';
      const s = (await import(`/tools/site/strings.${lang}.mjs`)).default;

      document.documentElement.lang = s.lang;

      const thread = document.getElementById('thread');
      const metaRow = (label, time) => {
        const li = document.createElement('li');
        li.className = 'meta';
        const b = document.createElement('b');
        b.textContent = label;
        li.append(b, ` ${time}`);
        return li;
      };
      const initials = (letter, small) => {
        const el = document.createElement('span');
        el.className = small ? 'initials sm' : 'initials';
        el.textContent = letter;
        return el;
      };

      // Outgoing turns are written three ways across the strings: `{ out: 'text' }`
      // in the hero and the week threads, `{ kind: 'out', text }` in the consent
      // loop, and `{ from: 'You', out: true, text }` in the group chat. All three
      // have to read as the parent's blue, right-aligned bubble.
      const isOutTurn = (turn) =>
        turn.kind === 'out' ||
        turn.out === true ||
        (turn.in === undefined && typeof turn.out === 'string');

      // One turn -> one row. `from` is set only in a group chat, where an
      // incoming message carries the sender's name and initials.
      const turnRow = (turn, from) => {
        const out = isOutTurn(turn);
        const text = turn.text ?? turn.in ?? turn.out ?? '';
        const li = document.createElement('li');
        li.className = `row ${out ? 'out' : 'in'}`;
        li.dataset.from = from ?? '';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (!out && from) {
          bubble.classList.add('has-sender');
          const who = document.createElement('span');
          who.className = 'sender';
          who.textContent = from;
          bubble.append(who);
        }
        const body = document.createElement('span');
        body.textContent = text;
        bubble.append(body);
        if (!out && from) li.append(initials(from.charAt(0)));
        li.append(bubble);
        return li;
      };

      const renderThread = (items, { group = false } = {}) => {
        for (const turn of items) {
          const out = isOutTurn(turn);
          thread.append(turnRow(turn, group && !out ? (turn.from ?? 'Axolotl') : undefined));
        }
      };

      const phone = s.how.phone;
      document.getElementById('contact').textContent = phone.contact;

      if (which === 'week') {
        thread.append(metaRow(s.hero.phone.meta, s.hero.phone.metaTime));
        renderThread(s.hero.phone.thread);
      } else if (which === 'weekcol') {
        const col = s.week.cols[Number(params.get('i') ?? 0)] ?? s.week.cols[0];
        thread.append(metaRow(s.week.meta, col.time));
        renderThread(col.turns);
      } else if (which === 'circles') {
        // The nav becomes the group: stacked initials instead of one contact.
        const chat = s.circles.chat;
        const navBody = document.getElementById('nav-body');
        navBody.textContent = '';
        const stack = document.createElement('div');
        stack.className = 'nav-stack';
        for (const who of chat.group.split(', ')) stack.append(initials(who.charAt(0), true));
        const group = document.createElement('span');
        group.textContent = chat.group;
        navBody.append(stack, group);

        thread.append(metaRow(chat.meta, chat.metaTime));
        renderThread(chat.messages, { group: true });
      } else {
        thread.append(metaRow(phone.meta, phone.metaTime));
        renderThread(phone.thread);
      }

      // iOS groups a run of messages from ONE sender: the gap inside a run is
      // tight, and only the last bubble of one carries the tail. In a group chat
      // the sender matters, so a run is (direction, sender) — not every incoming
      // bubble. The key is captured up front: mutating className inside the loop
      // made each row look different from the next and put a tail on everything.
      const rows = [...thread.querySelectorAll('.row')];
      const key = rows.map(
        (row) => `${row.classList.contains('out') ? 'out' : 'in'}|${row.dataset.from ?? ''}`,
      );
      rows.forEach((row, i) => {
        const bubble = row.querySelector('.bubble');
        if (i + 1 < rows.length && key[i + 1] === key[i]) {
          rows[i + 1].classList.add('run');
        } else if (bubble) {
          bubble.classList.add('tail');
        }
      });

      // The screen must be FILLED: a thread shorter than the glass leaves a white
      // gap under the header. Overflow is fine — the oldest messages sit above
      // the glass, feathered — so the build fails only when there is not enough
      // conversation to fill the screen.
      const style = getComputedStyle(thread);
      const gap = parseFloat(style.rowGap) || 0;
      const kids = [...thread.children];
      const content = kids.reduce(
        (sum, el, i) => sum + el.getBoundingClientRect().height + (i ? gap : 0),
        0,
      );
      const inner =
        thread.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      document.documentElement.dataset.fit =
        content >= inner ? 'ok' : `short:${(inner - content).toFixed(1)}`;
      document.documentElement.dataset.measured = `${content.toFixed(1)}/${inner.toFixed(1)}`;
    </script>
  </body>
</html>
