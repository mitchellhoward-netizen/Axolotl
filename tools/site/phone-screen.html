<!doctype html>
<!--
  The screen that goes inside Apple's official iPhone bezel.

  Rendered by scripts/build-phone.mjs at the device's own logical size
  (402x874 for iPhone 17 Pro) at 3x, then composited into the bezel PNG. It is
  not part of the site: only the composited result is shipped.

  Why this exists: the brief asks for "a real iPhone screenshot of a staged,
  fictional conversation in Apple's official device frame". This renders that
  conversation with the real iOS metrics (SF Pro Text at 17pt, iOS bubble
  padding, the safe-area insets of the actual device) so the mockup reads as a
  device screenshot rather than a web page drawn to look like one.

  THIS IS A STAND-IN for a screenshot taken on a real iPhone. When the founder
  supplies one, drop it in and delete this file: the compositing step only needs
  an image the size of the screen rect.

  The page measures itself and records the result on <html data-fit>, so the
  build fails when the copy outgrows the screen instead of shipping a clipped
  conversation. It replaces the old check that measured a drawn frame from the
  markup: this screen is measured as rendered, in the real font.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>phone screen</title>
    <style>
      /* The device's own metrics. iPhone 17 Pro: 402x874pt, safe area 62 top and
         34 bottom. Everything below is sized the way iOS sizes it. */
      :root {
        --screen-w: 402px;
        --screen-h: 874px;
        --safe-top: 62px;
        --safe-bottom: 34px;
        --nav-h: 56px;
        --composer-h: 54px;
        --bubble-in: #e9e9eb;
        --bubble-out: #0b6fe0;
        --label: #3c3c43;
        --secondary: #8a8a8e;
        --hairline: rgba(60, 60, 67, 0.29);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: var(--screen-w);
        height: var(--screen-h);
        overflow: hidden;
        background: #fff;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #000;
      }

      /* ── status bar ─────────────────────────────────────────────────────── */
      .status {
        flex: 0 0 var(--safe-top);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 26px 8px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }

      .status-right {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .status svg {
        display: block;
      }

      /* ── contact header ─────────────────────────────────────────────────── */
      .nav {
        flex: 0 0 var(--nav-h);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-bottom: 0.5px solid var(--hairline);
      }

      .nav img {
        width: 26px;
        height: 26px;
        object-fit: contain;
      }

      .nav span {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.1px;
      }

      /* ── thread ─────────────────────────────────────────────────────────── */
      .thread {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0;
        padding: 12px 16px 8px;
        list-style: none;
        overflow: hidden;
      }

      /* A conversation shorter than the screen sits at the bottom, just above the
         composer, the way iOS anchors it. */
      .thread > :first-child {
        margin-top: auto;
      }

      .meta {
        align-self: center;
        padding-bottom: 2px;
        font-size: 12px;
        font-weight: 600;
        color: var(--secondary);
      }

      .meta b {
        font-weight: 600;
        color: #6e6e73;
      }

      .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .row.out {
        justify-content: flex-end;
      }

      /* A group chat. iOS shows a contact photo beside each message, and falls
         back to initials on a grey circle when there is not one — which is what
         these families have. The sender's name is printed inside the bubble. */
      .initials {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #d1d1d6;
        color: #48484a;
        font-size: 12px;
        font-weight: 600;
      }

      .initials.sm {
        width: 24px;
        height: 24px;
        font-size: 10.5px;
        box-shadow: 0 0 0 2px #fff;
      }

      .nav-stack {
        display: flex;
        align-items: center;
      }

      .nav-stack .initials + .initials {
        margin-left: -9px;
      }

      .sender {
        display: block;
        margin-bottom: 1px;
        font-size: 12px;
        font-weight: 600;
        color: #8a8a8e;
      }

      .bubble.has-sender {
        padding-top: 6px;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-width: 268px;
      }

      .bubble {
        padding: 8px 15px;
        border-radius: 19px;
        font-size: 17px;
        line-height: 22px;
        letter-spacing: -0.4px;
        word-wrap: break-word;
      }

      .row.in .bubble {
        background: var(--bubble-in);
        border-bottom-left-radius: 19px;
      }

      .row.out .bubble {
        background: var(--bubble-out);
        color: #fff;
      }

      /* The filled form, shown the way iOS shows a rich preview: a card under
         the bubble it belongs to. */
      .card {
        padding: 12px 14px;
        background: #f2f2f7;
        border: 0.5px solid rgba(60, 60, 67, 0.12);
        border-radius: 18px;
      }

      .card-label {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #6e6e73;
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        background: #fff;
        border-radius: 12px;
      }

      .card-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 5px;
        border-bottom: 0.5px solid rgba(60, 60, 67, 0.12);
        font-size: 13px;
        line-height: 17px;
        color: var(--label);
      }

      .card-row:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .card-row b {
        font-weight: 600;
        color: #000;
      }

      /* The hero card: the family's week, with the site's own status
         vocabulary. Same five rows the paper folder held. */
      .card-plan,
      .card-week {
        width: 322px;
      }

      .plan-row {
        padding: 9px 0;
        border-bottom: 0.5px solid rgba(60, 60, 67, 0.12);
      }

      .plan-row:first-child {
        padding-top: 0;
      }

      .plan-row:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .plan-label {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 19px;
        letter-spacing: -0.3px;
      }

      .plan-detail {
        margin: 2px 0 0;
        font-size: 13px;
        line-height: 17px;
        color: var(--label);
      }

      /* The status sits on its own line. Beside the label it left no room for
         the stamp that lands on the confirmed row, and the stamp covered the
         label's second line. */
      .plan-row .chip {
        display: inline-block;
        margin-top: 6px;
      }

      .chip {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
      }

      /* The same vocabulary as the page: the brand colour is the confirmed
         state, amber is the parent's turn, and everything else is neutral. */
      .chip-confirmed {
        padding: 2px 6px;
        border: 2px double #1f7c4b;
        border-radius: 2px;
        color: #1f7c4b;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        transform: rotate(-5deg);
      }

      .chip-waiting {
        padding: 2px 8px;
        border: 1px dashed #e46300;
        border-radius: 999px;
        color: #9a3700;
      }

      .chip-requested {
        padding: 2px 8px;
        border: 1px solid #dbd3c8;
        border-radius: 999px;
        color: #5a4d42;
      }

      .chip-reminder {
        padding: 2px 8px;
        border: 1px solid #dbd3c8;
        border-radius: 999px;
        color: #72675b;
      }

      .chip-soon {
        padding: 2px 8px;
        border: 1px dashed #dbd3c8;
        border-radius: 999px;
        color: #72675b;
      }

      /* The work Axolotl did, as a message: the same bubble as everything else,
         holding the label, the rows and the status. A message from the agent, not
         a panel floating in the thread. */
      .bubble.card-msg {
        width: 322px;
        padding: 10px 14px 11px;
      }

      .card-msg .card-label {
        margin-bottom: 6px;
      }

      .card-msg .card-row {
        display: block;
        padding: 7px 0;
      }

      .card-msg .chip {
        display: inline-block;
        margin-top: 7px;
      }

      /* iOS draws the tail on the last bubble of a run, and tightens the gap
         inside one: two messages from the same sender sit almost together. */
      .bubble.tail {
        position: relative;
      }

      .bubble.tail::before,
      .bubble.tail::after {
        content: "";
        position: absolute;
        bottom: 0;
        z-index: -1;
      }

      .row.in .bubble.tail::before {
        left: -7px;
        width: 20px;
        height: 20px;
        background: inherit;
        border-bottom-right-radius: 16px;
      }

      .row.in .bubble.tail::after {
        left: -26px;
        width: 26px;
        height: 20px;
        background: #fff;
        border-bottom-right-radius: 13px;
      }

      .row.out .bubble.tail::before {
        right: -7px;
        width: 20px;
        height: 20px;
        background: inherit;
        border-bottom-left-radius: 16px;
      }

      .row.out .bubble.tail::after {
        right: -26px;
        width: 26px;
        height: 20px;
        background: #fff;
        border-bottom-left-radius: 13px;
      }

      .row.run {
        margin-top: -6px;
      }

      /* A shared page: iMessage draws the link's own card inside the bubble. */
      .link-preview {
        margin-top: 7px;
        padding: 9px 11px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 13px;
      }

      .link-domain {
        display: block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78);
      }

      .link-title {
        display: block;
        margin-top: 3px;
        font-size: 15px;
        font-weight: 600;
        line-height: 19px;
        color: #fff;
      }

      .card-note {
        margin: 9px 2px 0;
        font-size: 13px;
        line-height: 17px;
        color: var(--label);
      }

      /* ── composer ───────────────────────────────────────────────────────── */
      .composer {
        flex: 0 0 var(--composer-h);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-top: 0.5px solid var(--hairline);
      }

      .plus {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #e9e9eb;
        color: #8a8a8e;
        font-size: 20px;
        line-height: 1;
      }

      .field {
        flex: 1 1 auto;
        padding: 7px 14px;
        border: 0.5px solid var(--hairline);
        border-radius: 999px;
        font-size: 17px;
        line-height: 20px;
        color: #8a8a8e;
      }

      .home {
        flex: 0 0 var(--safe-bottom);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .home span {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: #000;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span id="clock">9:41</span>
      <span class="status-right" aria-hidden="true">
        <!-- iOS status-bar glyphs at their real sizes. -->
        <svg width="19" height="12" viewBox="0 0 19 12" fill="#000">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="1" />
          <rect x="4.6" y="5" width="3.2" height="7" rx="1" />
          <rect x="9.2" y="2.6" width="3.2" height="9.4" rx="1" />
          <rect x="13.8" y="0" width="3.2" height="12" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
          <path d="M1 4.1a10.5 10.5 0 0 1 14 0" />
          <path d="M3.6 6.9a6.8 6.8 0 0 1 8.8 0" />
          <path d="M6.2 9.6a3 3 0 0 1 3.6 0" />
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
          <rect x="0.6" y="0.6" width="22" height="11.8" rx="3.6" stroke="#000" stroke-opacity="0.36" stroke-width="1.1" />
          <rect x="2.2" y="2.2" width="18.8" height="8.6" rx="2.4" fill="#000" />
          <path d="M24.4 4.4v4.2a2.4 2.4 0 0 0 0-4.2Z" fill="#000" fill-opacity="0.42" />
        </svg>
      </span>
    </div>

    <div class="nav">
      <img src="/public/animation/axolotl-mascot.png" alt="" />
      <span id="contact">Axolotl</span>
    </div>

    <ol class="thread" id="thread">
      <li class="meta" id="meta"></li>
    </ol>

    <div class="composer">
      <span class="plus">+</span>
      <span class="field" id="field">iMessage</span>
    </div>

    <div class="home"><span></span></div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'es' ? 'es' : 'en';
      // 'yes' is the consent loop in "How your yes works", 'week' is the hero,
      // 'circles' is the group chat the families coordinate in, and 'weekcol' is
      // one of the four cards of the week section (?i=0..3).
      const asked = params.get('screen');
      const which = ['week', 'circles', 'weekcol'].includes(asked) ? asked : 'yes';
      const s = (await import(`/tools/site/strings.${lang}.mjs`)).default;

      document.documentElement.lang = s.lang;

      const thread = document.getElementById('thread');
      const metaRow = (label, time) => {
        const li = document.createElement('li');
        li.className = 'meta';
        const b = document.createElement('b');
        b.textContent = label;
        li.append(b, ` ${time}`);
        return li;
      };
      const initials = (letter, small) => {
        const el = document.createElement('span');
        el.className = small ? 'initials sm' : 'initials';
        el.textContent = letter;
        return el;
      };
      const groupRow = (from, text) => {
        const li = document.createElement('li');
        li.className = 'row in';
        const bubble = document.createElement('div');
        bubble.className = 'bubble has-sender';
        const who = document.createElement('span');
        who.className = 'sender';
        who.textContent = from;
        const body = document.createElement('span');
        body.textContent = text;
        bubble.append(who, body);
        li.append(initials(from.charAt(0)), bubble);
        return li;
      };
      const bubbleRow = (kind, text) => {
        const li = document.createElement('li');
        li.className = `row ${kind}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        li.append(bubble);
        return li;
      };

      const phone = s.how.phone;
      document.getElementById('contact').textContent = phone.contact;

      if (which === 'week') {
        const hero = s.hero;
        thread.append(metaRow(hero.phone.meta, hero.phone.metaTime));

        const card = document.createElement('div');
        card.className = 'card card-plan';
        const title = document.createElement('p');
        title.className = 'card-label';
        title.textContent = hero.phone.cardTitle;
        card.append(title);

        for (const row of hero.folder.rows) {
          const line = document.createElement('div');
          line.className = 'plan-row';
          if (row.annotated) line.dataset.annotated = 'true';

          const label = document.createElement('span');
          label.className = 'plan-label';
          label.textContent = row.label;

          const detail = document.createElement('p');
          detail.className = 'plan-detail';
          detail.textContent = row.tag ? `${row.detail} (${row.tag})` : row.detail;

          const chip = document.createElement('span');
          chip.className = `chip chip-${row.status}`;
          chip.textContent = s.statuses[row.status];
          if (row.status === 'confirmed') {
            // The page lands an animated stamp on this row, so the chip holds the
            // space but does not paint: two "Confirmed" marks would collide.
            chip.dataset.stamp = 'true';
            chip.style.visibility = 'hidden';
          }

          line.append(label, detail, chip);
          card.append(line);
        }

        const li = document.createElement('li');
        li.className = 'row in';
        li.append(card);
        thread.append(li);
      } else if (which === 'weekcol') {
        // One screen of the week section, as the parent receives it: the school's
        // notice, what the parent said back, the work the agent did, and the one
        // thing it needs from them. A conversation, not a card floating in white.
        const col = s.week.cols[Number(params.get('i') ?? 0)] ?? s.week.cols[0];
        thread.append(metaRow(s.week.meta, col.time));

        const card = document.createElement('div');
        card.className = 'card-msg-body';
        const label = document.createElement('p');
        label.className = 'card-label';
        label.textContent = s.week.stepsLabel;
        const body = document.createElement('div');
        body.className = 'card-body';
        for (const step of col.steps) {
          const row = document.createElement('div');
          row.className = 'card-row';
          const text = document.createElement('span');
          text.textContent = step;
          row.append(text);
          body.append(row);
        }
        const chip = document.createElement('span');
        chip.className = `chip chip-${col.status}`;
        chip.textContent = s.statuses[col.status];
        card.append(label, body, chip);

        for (const turn of col.turns) {
          if (turn.card) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble card-msg';
            bubble.append(card);
            const li = document.createElement('li');
            li.className = 'row in';
            li.append(bubble);
            thread.append(li);
            continue;
          }
          if (turn.link) {
            // The parent forwards the school's email, so the message carries the
            // link preview iOS draws for a shared page.
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const preview = document.createElement('div');
            preview.className = 'link-preview';
            const domain = document.createElement('span');
            domain.className = 'link-domain';
            domain.textContent = s.week.preview.domain;
            const title = document.createElement('span');
            title.className = 'link-title';
            title.textContent = s.week.preview.title;
            preview.append(domain, title);
            bubble.append(preview);
            const li = document.createElement('li');
            li.className = 'row out';
            li.append(bubble);
            thread.append(li);
            continue;
          }
          thread.append(bubbleRow(turn.out === undefined ? 'in' : 'out', turn.out ?? turn.in));
        }
      } else if (which === 'circles') {
        // The group the families actually coordinate in. The nav becomes the
        // group — initials instead of the one contact — and every message is
        // signed, which is what makes the plan read as agreed rather than told.
        const chat = s.circles.chat;
        const nav = document.querySelector('.nav');
        nav.textContent = '';
        const stack = document.createElement('div');
        stack.className = 'nav-stack';
        for (const who of chat.group.split(', ')) stack.append(initials(who.charAt(0), true));
        const group = document.createElement('span');
        group.textContent = chat.group;
        nav.append(stack, group);

        thread.append(metaRow(chat.meta, chat.metaTime));
        for (const message of chat.messages) {
          // The parent's own message is the blue one on the right, with no
          // sender name — exactly as iOS treats you in a group.
          thread.append(
            message.out ? bubbleRow('out', message.text) : groupRow(message.from, message.text),
          );
        }
      } else {
        // The consent loop: incoming messages, the filled form, the parent's yes.
        thread.append(metaRow(phone.meta, phone.metaTime));
        let pending = [];
        const flush = () => {
          if (!pending.length) return;
          const stack = document.createElement('div');
          stack.className = 'stack';
          pending.forEach((node) => stack.append(node));
          const li = document.createElement('li');
          li.className = 'row in';
          li.append(stack);
          thread.append(li);
          pending = [];
        };

        for (const item of phone.thread) {
          if (item.kind === 'in') {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = item.text;
            pending.push(bubble);
            continue;
          }
          if (item.kind === 'form') {
            const card = document.createElement('div');
            card.className = 'card';
            const label = document.createElement('p');
            label.className = 'card-label';
            label.textContent = item.label;
            const body = document.createElement('div');
            body.className = 'card-body';
            for (const [k, v] of item.rows) {
              const row = document.createElement('div');
              row.className = 'card-row';
              const key = document.createElement('span');
              key.textContent = k;
              const val = document.createElement('b');
              val.textContent = v;
              row.append(key, val);
              body.append(row);
            }
            const note = document.createElement('p');
            note.className = 'card-note';
            note.textContent = item.caption;
            card.append(label, body, note);
            pending.push(card);
            continue;
          }
          flush();
          thread.append(bubbleRow('out', item.text));
        }
        flush();
      }

      // iOS groups a run of messages from one sender: the gap inside a run is
      // tight, and only the last bubble of one carries the tail.
      const rows = [...thread.querySelectorAll('.row')];
      rows.forEach((row, i) => {
        const next = rows[i + 1];
        const last = !next || next.className !== row.className;
        const bubble = row.querySelector('.bubble');
        if (last) {
          if (bubble) bubble.classList.add('tail');
        } else if (next) {
          next.classList.add('run');
        }
      });

      // Report whether the staged conversation fits the screen. The build fails
      // on overflow rather than shipping a clipped screenshot. The height is the
      // sum of the children rather than scrollHeight: the auto margin that
      // bottom-anchors a short thread would otherwise hide the real slack.
      const style = getComputedStyle(thread);
      const gap = parseFloat(style.rowGap) || 0;
      const kids = [...thread.children];
      const content = kids.reduce(
        (sum, el, i) => sum + el.getBoundingClientRect().height + (i ? gap : 0),
        0,
      );
      const inner =
        thread.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      document.documentElement.dataset.fit =
        content <= inner ? 'ok' : `overflow:${(content - inner).toFixed(1)}`;
      document.documentElement.dataset.measured = `${content.toFixed(1)}/${inner.toFixed(1)}`;

      // Where the page should draw the pen circle and land the stamp, in screen
      // pixels. The page overlays those two marks on the render so the brief's
      // one load moment survives the hero becoming a device.
      const rectOf = (el) => {
        const r = el.getBoundingClientRect();
        return { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1) };
      };
      const marks = {};
      const stamped = thread.querySelector('[data-stamp]');
      const annotated = thread.querySelector('[data-annotated]');
      const plan = thread.querySelector('.card-plan');
      if (stamped) marks.stamp = rectOf(stamped);
      if (annotated) marks.pen = rectOf(annotated);
      if (plan) marks.card = rectOf(plan);
      document.documentElement.dataset.marks = JSON.stringify(marks);
    </script>
  </body>
</html>
