# Learner model and diagnostic parameters (non-Jev). Jev questions and
# thresholds live in jev_questions.yaml.

learner:
  # Structured prior over the skill graph (used by the diagnostic).
  prior:
    foundation: 0.80        # P(mastered | all prerequisites mastered)
    chapter: 0.45
    core: 0.35              # a course skill (book courses)
    prerequisites_missing: 0.08
  # A skill counts as mastered only after this many graded practice problems on it
  # (unless the diagnostic placed it as mastered). One right answer is not mastery.
  min_practice_for_mastery: 3
  slip: 0.10                # P(wrong | all required skills mastered)
  learn: 0.12               # BKT transition per practiced problem, scaled by credit
  learn_foundation: 0.30    # rusty foundations come back faster than new material is learned
  mastery_threshold: 0.85   # "mastered" for scheduling / frontier
  review:
    first_interval_days: 1.0
    growth: 2.5             # stability multiplier on a clean success
    min_credit_for_growth: 0.7
    max_interval_days: 120

diagnostic:
  min_questions: 25
  max_questions: 40
  round_sizes: [10, 10, 5, 5, 5, 5]   # questions per printed round
  particles: 30000
  seed: 20260930
  stop_max_marginal_entropy_bits: 0.5  # stop (after min_questions) when every skill is this certain

evidence_policy:
  # How Jev's typed answers turn into one learner-model update per problem.
  restart_credit: 0.75            # correct, but only after abandoning an approach
  substeps_floor: 0.6             # credit multiplier when no expected sub-computation is written
  off_strategy_credit: 0.8        # correct via a strategy outside the target skill (e.g. table, L'Hopital)
  invalid_step_credit: 0.7        # right final answer but SymPy found an invalid step
  misconception_likelihood: 0.25  # P(evidence | root skill mastered) relative to 1.0 if not mastered
  skip_credit: 0.0

lesson:
  problems_per_skill: 3
  target_skills_per_packet: 2
  new_skills_per_packet: 1      # book courses: one new idea per lesson packet
  new_skill_problems: 4         # practice for a new skill: one faded (partly worked) + three
  review_share: 0.35            # share of a packet's practice that is mixed review of earlier skills
  max_review: 4

# Where a parent says their child is starting. It shifts the diagnostic's prior (learner.prior),
# so a student who finished Algebra 1 is not first asked about fractions. "unsure" keeps the defaults.
starting_points:
  algebra1:
    arithmetic: {label: "Comfortable with arithmetic, new to algebra", prior: {foundation: 0.80, core: 0.08}}
    partway: {label: "Partway through Algebra 1", prior: {foundation: 0.88, core: 0.40}}
    reviewing: {label: "Finished Algebra 1 and reviewing", prior: {foundation: 0.92, core: 0.65}}
    rusty: {label: "Struggles with fractions and negative numbers", prior: {foundation: 0.45, core: 0.05}}
    unsure: {label: "Not sure", prior: {}}
  calc_limits:
    unsure: {label: "Not sure", prior: {}}

# Per-learner daily limits (they bound the cost of the AI checks for one account).
limits:
  photos_per_day: 40
  questions_per_day: 60
  packets_per_day: 12
