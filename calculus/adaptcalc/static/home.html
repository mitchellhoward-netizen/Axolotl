<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia · Your books</title>
<link rel="stylesheet" href="/static/book.css">
<style>
.learner { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; padding: 18px 0; border-bottom: 1px dotted var(--rule); align-items: baseline; }
.learner:last-child { border-bottom: 0; }
.learner h3 a { color: var(--ink); text-decoration: none; }
.learner h3 a:hover { color: var(--spot); }
.learner .meta { grid-column: 1 / -1; font-size: 15px; color: var(--ink-2); }
.learner .meter { grid-column: 1 / -1; margin-top: 4px; }
.learner .acts { display: flex; gap: 14px; align-items: baseline; }
details.more summary { cursor: pointer; font-variant-caps: all-small-caps; letter-spacing: .1em; color: var(--ink-2); }
</style>
</head>
<body>
<header class="masthead">
  <a class="brand" href="/home"><span class="orn">❦</span>Marginalia</a>
  <nav><button class="linkish" onclick="toggleTheme()">Light / dark</button><button class="linkish" onclick="signOut()">Sign out</button></nav>
  <div class="rule"></div>
</header>
<main>
  <div class="kicker" id="greeting">Your family’s books</div>
  <h1>The books</h1>
  <hr class="title-rule">

  <div class="grid2">
    <div>
      <section class="leaf">
        <div id="learners"><p class="muted">Opening the shelf…</p></div>
      </section>
    </div>
    <div>
      <section class="leaf" id="addLeaf">
        <div class="section-label"><span class="num">+</span><h3>Add a child</h3></div>
        <form id="add">
          <label class="field"><span>First name</span><input type="text" id="lname" maxlength="40" required autocomplete="off"></label>
          <label class="field"><span>The grade they’re in</span><select id="lgrade" required>
            <option value="">Choose…</option><option value="K">Kindergarten</option><option value="1">1st grade</option>
            <option value="2">2nd grade</option><option value="3">3rd grade</option><option value="4">4th grade</option>
            <option value="5">5th grade</option><option value="6">6th grade</option><option value="7">7th grade</option>
            <option value="8">8th grade</option><option value="9">9th grade or Algebra 1</option></select></label>
          
        <label class="field"><span>Already using a math book? <span class="muted">(optional)</span></span><input type="text" id="lbook" maxlength="80"
          autocomplete="off" placeholder="e.g. Saxon Math 5/4, Singapore 3A"></label>
          <div class="row"><button class="btn primary" type="submit">Start their book</button></div>
          <p id="addMsg" class="err" role="alert"></p>
        </form>
      </section>
      <section class="leaf hidden" id="billLeaf">
        <div class="section-label"><span class="num">¤</span><h3>Subscription</h3></div>
        <div id="bill"></div>
      </section>
      <section class="leaf" id="account">
        <div class="section-label"><span class="num">§</span><h3>Account</h3></div>
        <p class="small muted" id="who"></p>
        <label class="small" style="display:flex;gap:8px;align-items:baseline;margin-top:6px"><input type="checkbox" id="weekly">
          A short note each week about what each learner did (only in weeks with work).</label>
        <div class="row"><a class="btn quiet" href="/api/account/export">Download my data</a></div>
        <details class="more" style="margin-top:16px"><summary>Change password</summary>
          <form id="pw">
            <label class="field"><span>Current password</span><input type="password" id="pwOld" autocomplete="current-password"></label>
            <label class="field"><span>New password (10 or more characters)</span><input type="password" id="pwNew" autocomplete="new-password"></label>
            <div class="row"><button class="btn" type="submit">Change it</button></div>
            <p id="pwMsg" role="alert"></p>
          </form>
        </details>
        <details class="more" style="margin-top:12px"><summary>Delete the account</summary>
          <p class="small">This removes every learner, packet, photo and answer for good.</p>
          <form id="del">
            <label class="field"><span>Password</span><input type="password" id="delPw" autocomplete="current-password"></label>
            <label class="field"><span>Type DELETE to confirm</span><input type="text" id="delConfirm" autocomplete="off"></label>
            <div class="row"><button class="btn danger" type="submit">Delete everything</button></div>
            <p id="delMsg" class="err" role="alert"></p>
          </form>
        </details>
      </section>
    </div>
  </div>
</main>
<footer class="colophon"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
<script src="/static/book.js"></script>
<script>
let me = null;
function renderBilling() {
  const b = me.billing;
  if (!b.enabled) return;
  $("#billLeaf").classList.remove("hidden");
  const until = b.until ? new Date(b.until).toLocaleDateString(undefined, { month: "long", day: "numeric" }) : "";
  const words = {
    comp: "Your family is part of the pilot: everything is included, free.",
    trialing: `Your free trial runs until ${until}.`,
    active: `Your subscription is active${until ? `; it renews ${until}` : ""}.`,
    past_due: "The last payment didn’t go through. Update the card to keep making new packets.",
    canceled: "The subscription has ended. Books already made stay readable.",
    none: `One subscription covers every learner in the family${b.price ? `: ${b.price}` : ""}. ${b.trial_days ? `The first ${b.trial_days} days are free, and you can cancel any time.` : ""}`,
  };
  let h = `<p>${esc(words[b.plan] || words.none)}</p><div class="row">`;
  if (b.plan === "none" || b.plan === "canceled") h += `<button class="btn primary" id="subscribe">${b.plan === "canceled" ? "Restart the subscription" : b.trial_days ? "Start the free trial" : "Subscribe"}</button>`;
  if (b.can_manage && b.plan !== "comp") h += `<button class="btn" id="manage">Manage billing</button>`;
  h += `</div><p id="billMsg" class="small" role="status"></p>`;
  $("#bill").innerHTML = h;
  const go = async (path) => { try { location.href = (await api(path, { method: "POST" })).url; } catch (e) { $("#billMsg").className = "err"; $("#billMsg").textContent = e.message; } };
  if ($("#subscribe")) $("#subscribe").onclick = () => go("/api/billing/checkout");
  if ($("#manage")) $("#manage").onclick = () => go("/api/billing/portal");
  const q = new URLSearchParams(location.search).get("billing");
  if (q === "done") $("#billMsg").innerHTML = `<span class="ok">Thank you. It can take a few seconds for the subscription to show here.</span>`;
}
function render() {
  $("#who").textContent = `Signed in as ${me.family.email}.`;
  $("#weekly").checked = me.family.weekly;
  renderBilling();
  if (me.family.name) $("#greeting").textContent = `${me.family.name}’s books`;
  if (!me.learners.length) {
    $("#learners").innerHTML = `<p class="lede" style="margin:0">No books yet.</p>
      <p class="muted">Add a child: their first name and grade is all it takes. The first pages start being written straight away.</p>`;
    return;
  }
  $("#learners").innerHTML = me.learners.map((l) => {
    const status = l.open.length ? "Pages ready to print" : (l.problems ? "Next pages on the way" : "First pages being written");
    return `<div class="learner">
      <h3><a href="/learn/${l.id}">${esc(l.name)}’s book</a></h3>
      <div class="acts"><a class="btn primary" href="/learn/${l.id}">Open</a></div>
      <div class="meta">${esc(l.course.title)} · ${status}${l.problems ? ` · ${l.correct} of ${l.problems} problems right so far` : ""}${l.last ? ` · last work ${fmtDate(l.last)}` : ""}
        · <a class="linkish" style="font-size:15px" href="/learn/${l.id}/records">records</a>
        · <button class="linkish" style="font-size:15px" data-remove="${l.id}" data-name="${esc(l.name)}">remove</button></div>
    </div>`;
  }).join("");
}
async function load() {
  me = await api("/api/me");
  // one child and nothing else asked for: their book is the home page
  if (me.learners.length === 1 && !location.hash && !new URLSearchParams(location.search).has("billing")) { location.replace(`/learn/${me.learners[0].id}`); return; }
  render();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}
$("#weekly").onchange = () => api("/api/account/weekly", { method: "POST", json: { on: $("#weekly").checked } }).catch((e) => alert(e.message));
$("#add").onsubmit = async (e) => {
  e.preventDefault(); $("#addMsg").textContent = "";
  try {
    if (!$("#lgrade").value) throw new Error("Choose the grade they’re in.");
    const r = await api("/api/learners", { method: "POST", json: { name: $("#lname").value, grade: $("#lgrade").value, book: $("#lbook").value } });
    location.href = `/learn/${r.id}`;
  } catch (err) { $("#addMsg").textContent = err.message; }
};
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-remove]");
  if (!b) return;
  if (!confirm(`Remove ${b.dataset.name} and all of their work? This can't be undone.`)) return;
  try { await api(`/api/learners/${b.dataset.remove}`, { method: "DELETE" }); await load(); } catch (err) { alert(err.message); }
});
$("#pw").onsubmit = async (e) => {
  e.preventDefault();
  try { await api("/api/account/password", { method: "POST", json: { current: $("#pwOld").value, password: $("#pwNew").value } });
        $("#pwMsg").className = "ok"; $("#pwMsg").textContent = "Changed. Other devices are signed out."; }
  catch (err) { $("#pwMsg").className = "err"; $("#pwMsg").textContent = err.message; }
};
$("#del").onsubmit = async (e) => {
  e.preventDefault();
  try { await api("/api/account/delete", { method: "POST", json: { password: $("#delPw").value, confirm: $("#delConfirm").value } }); location.href = "/"; }
  catch (err) { $("#delMsg").textContent = err.message; }
};
load().catch((e) => { $("#learners").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
