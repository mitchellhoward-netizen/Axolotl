<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<style>
@font-face { font-family: "Fira Sans"; src: url(/fonts/FiraSans-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Fira Sans"; src: url(/fonts/FiraSans-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Fira Sans"; src: url(/fonts/FiraSans-Bold.ttf); font-weight: 700; }
:root {
  color-scheme: light;
  --spot: #006b7f; --spot-ink: #ffffff; --tint: #e3f0f2; --tint2: #f1f7f8;
  --bg: #fbfaf7; --card: #ffffff; --ink: #1c1d1f; --muted: #5d6166; --line: #dde3e5;
  --radius: 10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --spot: #5aa9b5; --spot-ink: #0d1a1c; --tint: #22292c; --tint2: #1b2124;
  --bg: #141618; --card: #1b1e21; --ink: #e6e8e9; --muted: #9ba2a7; --line: #2b3034;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Fira Sans", system-ui, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; border-bottom: 3px solid var(--spot); padding-bottom: 10px; margin-bottom: 20px; }
header h1 { margin: 0; font-size: 26px; }
header .kicker { color: var(--spot); font-weight: 700; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; width: 100%; }
header .links { margin-left: auto; display: flex; gap: 8px; }
.nav { font-size: 13px; font-weight: 600; color: var(--spot); text-decoration: none; border: 1px solid var(--spot); border-radius: 99px; padding: 2px 10px; background: none; cursor: pointer; font-family: inherit; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
.card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--spot); }
.muted { color: var(--muted); font-size: 14px; }
/* 14-day activity: one series, spot color, 2px gaps, rounded data ends, recessive axis */
.chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; align-items: end; height: 120px; border-bottom: 1px solid var(--line); position: relative; }
.col { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; cursor: default; }
.col i { display: block; width: 70%; background: var(--spot); border-radius: 4px 4px 0 0; min-height: 0; }
.col:hover i, .col:focus i { outline: 2px solid var(--ink); outline-offset: 1px; }
.col .tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 3px 7px; border-radius: 6px; white-space: nowrap; z-index: 2; }
.col:hover .tip, .col:focus .tip { display: block; }
.axis { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.group { margin-top: 12px; }
.group summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.skill { display: grid; grid-template-columns: 1fr 88px 40px; gap: 4px 10px; align-items: center; font-size: 14px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--tint); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--spot); border-radius: 3px; }
.state { font-size: 12px; color: var(--muted); text-align: right; }
.p { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.mis { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.mis b { font-variant-numeric: tabular-nums; }
@media print { .links, details > summary::marker { display: none; } body { background: white; } .card, .tile { break-inside: avoid; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">Progress report</div>
    <h1>Where things stand</h1>
    <div class="links"><a class="nav" href="/">Back to work</a><button class="nav" onclick="print()">Print</button></div>
  </header>
  <div class="tiles" id="tiles"></div>
  <section class="card"><h2>Next up</h2><div id="next" class="muted"></div></section>
  <section class="card">
    <h2>Problems checked, last 14 days</h2>
    <div class="chart" id="chart" role="img" aria-label="Problems checked per day"></div>
    <div class="axis" id="axis"></div>
    <details style="margin-top:10px"><summary class="muted">Show as a table</summary><table><thead><tr><th>Day</th><th class="n">Pages</th><th class="n">Problems</th><th class="n">Correct</th></tr></thead><tbody id="daytable"></tbody></table></details>
  </section>
  <section class="card"><h2>Mistakes that keep coming up</h2><div id="mis"></div></section>
  <section class="card"><h2>Every skill</h2><div id="groups"></div></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}

fetch("/api/progress").then((r) => r.json()).then((d) => {
  const acc = d.problems ? Math.round(100 * d.correct / d.problems) : 0;
  $("#tiles").innerHTML = [
    [`${d.mastered}/${d.total}`, "skills mastered"],
    [d.problems, `problems checked${d.problems ? ` · ${acc}% correct` : ""}`],
    [d.questions, "questions asked about the work"],
    [`${d.diagnostic.answered}/${d.diagnostic.asked}`, `diagnostic questions answered · ${d.diagnostic.uncertainty_bits} bits unsure`],
  ].map(([v, l]) => `<div class="tile"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join("");

  $("#next").innerHTML = (d.next.length ? `Working on: <b>${d.next.map(esc).join("</b>, <b>")}</b>.` : "Nothing on the frontier right now.")
    + (d.reviews.length ? ` Due for review: ${d.reviews.map(esc).join(", ")}.` : "");

  const max = Math.max(1, ...d.days.map((x) => x.problems));
  $("#chart").innerHTML = d.days.map((x) => {
    const h = x.problems ? Math.max(4, 100 * x.problems / max) : 0;
    const date = new Date(x.day + "T12:00:00");
    const label = date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return `<div class="col" tabindex="0" aria-label="${label}: ${x.problems} problems, ${x.correct} correct">
      <i style="height:${h}%"></i><span class="tip">${label}: ${x.problems} problem${x.problems === 1 ? "" : "s"}, ${x.correct} correct</span></div>`;
  }).join("");
  $("#axis").innerHTML = d.days.map((x, i) => `<span>${i % 2 === 1 ? "" : new Date(x.day + "T12:00:00").getDate()}</span>`).join("");
  $("#daytable").innerHTML = d.days.map((x) => `<tr><td>${x.day}</td><td class="n">${x.pages}</td><td class="n">${x.problems}</td><td class="n">${x.correct}</td></tr>`).join("");

  $("#mis").innerHTML = d.misconceptions.length ? d.misconceptions.map((m) =>
    `<div class="mis"><b>${m.count}×</b> ${esc(m.description)} <span class="muted">(underlying skill: ${esc(m.root)})</span></div>`).join("")
    : `<p class="muted">None yet. Mistakes found in your photographed work show up here.</p>`;

  const word = { mastered: "mastered", practicing: "practicing", assessed: "assessed", "not started": "not started" };
  $("#groups").innerHTML = d.groups.map((g) => `<details class="group" ${g.name.startsWith("Calculus") ? "" : "open"}>
    <summary>${esc(g.name)} · ${g.mastered}/${g.skills.length} mastered</summary>
    ${g.skills.map((s) => `<div class="skill"><span>${esc(s.name)}</span><span class="state">${word[s.state]}</span><span class="p">${Math.round(s.p * 100)}%</span>
      <div class="bar"><i style="width:${(s.p * 100).toFixed(1)}%"></i></div></div>`).join("")}
  </details>`).join("");
}).catch((e) => { $("#tiles").innerHTML = `<p class="muted">Could not load progress (${esc(e.message)}).</p>`; });
</script>
</body>
</html>
